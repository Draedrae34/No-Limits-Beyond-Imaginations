<!-- AI Assistant Chat Interface -->
<div class="ai-assistant-widget">
    <div class="ai-header">
        <div class="ai-avatar">🤖</div>
        <div class="ai-info">
            <h3>No Limits AI Assistant</h3>
            <p>I'm here to help with products, orders, and more!</p>
        </div>
        <button class="ai-toggle" onclick="toggleAIChat()">💬 Chat</button>
    </div>
    
    <div class="ai-chat-container" id="ai-chat-container" style="display: none;">
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-container">
            <input type="text" id="ai-chat-input" placeholder="Ask me anything about our products..." onkeypress="handleAIChatKeyPress(event)">
            <button onclick="sendAIMessage()">Send</button>
        </div>
    </div>
    
    <div class="ai-typing-indicator" id="ai-typing" style="display: none;">
        <div class="typing-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <span class="typing-text">AI is thinking...</span>
    </div>
</div>

<style>
.ai-assistant-widget {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 350px;
    max-height: 500px;
    background: linear-gradient(135deg, #1a1a2e, #2d1b69);
    border: 2px solid #00ffff;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0, 255, 255, 0.3);
    z-index: 10000;
    font-family: 'Raleway', sans-serif;
    transition: all 0.3s ease;
}

.ai-assistant-widget:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 40px rgba(0, 255, 255, 0.5);
}

.ai-header {
    display: flex;
    align-items: center;
    padding: 15px;
    background: rgba(0, 255, 255, 0.1);
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
}

.ai-avatar {
    width: 40px;
    height: 40px;
    background: linear-gradient(45deg, #00ffff, #0099cc);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    margin-right: 10px;
}

.ai-info h3 {
    color: #00ffff;
    font-size: 14px;
    margin: 0;
}

.ai-info p {
    color: rgba(255, 255, 255, 0.8);
    font-size: 12px;
    margin: 0;
}

.ai-toggle {
    background: linear-gradient(45deg, #00ffff, #0099cc);
    border: none;
    color: #1a1a2e;
    padding: 8px 15px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.3s ease;
}

.ai-toggle:hover {
    transform: scale(1.05);
    box-shadow: 0 5px 15px rgba(0, 255, 255, 0.5);
}

.ai-chat-container {
    height: 400px;
    background: rgba(26, 10, 46, 0.9);
    border-radius: 10px;
    overflow: hidden;
}

.chat-messages {
    height: 300px;
    overflow-y: auto;
    padding: 15px;
}

.ai-message {
    margin-bottom: 15px;
    animation: slideInUp 0.3s ease;
}

.ai-message.user {
    text-align: right;
}

.ai-message.user .message-content {
    background: linear-gradient(45deg, #00ffff, #0099cc);
    color: #1a1a2e;
    padding: 10px 15px;
    border-radius: 15px;
    max-width: 80%;
}

.ai-message.assistant .message-content {
    background: linear-gradient(45deg, #2d1b69, #1a1a2e);
    color: #00ffff;
    padding: 10px 15px;
    border-radius: 15px;
    max-width: 80%;
}

.message-time {
    font-size: 10px;
    color: rgba(255, 255, 255, 0.6);
    margin-top: 5px;
}

.chat-input-container {
    display: flex;
    padding: 10px;
    background: rgba(0, 0, 0, 0.3);
}

.ai-chat-input {
    flex: 1;
    padding: 10px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.1);
    color: #00ffff;
    font-size: 14px;
}

.ai-chat-input button {
    margin-left: 10px;
    background: linear-gradient(45deg, #00ffff, #0099cc);
    border: none;
    color: #1a1a2e;
    padding: 10px 20px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.3s ease;
}

.ai-chat-input button:hover {
    transform: scale(1.05);
}

.ai-typing-indicator {
    display: flex;
    align-items: center;
    padding: 15px;
    background: rgba(0, 0, 0, 0.5);
}

.typing-dots span {
    width: 8px;
    height: 8px;
    background: #00ffff;
    border-radius: 50%;
    margin: 0 3px;
    animation: typing 1.4s infinite;
}

.typing-dots span:nth-child(1) { animation-delay: 0s; }
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typing {
    0%, 60%, 100% { opacity: 0.3; }
    30% { opacity: 1; }
}

@keyframes slideInUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}
</style>

<script>
function toggleAIChat() {
    const chatContainer = document.getElementById('ai-chat-container');
    const typingIndicator = document.getElementById('ai-typing');
    
    if (chatContainer.style.display === 'none') {
        chatContainer.style.display = 'block';
        typingIndicator.style.display = 'flex';
    } else {
        chatContainer.style.display = 'none';
        typingIndicator.style.display = 'none';
    }
}

function handleAIChatKeyPress(event) {
    if (event.key === 'Enter' && !event.shiftKey) {
        sendAIMessage();
    }
}

function sendAIMessage() {
    const input = document.getElementById('ai-chat-input');
    const message = input.value.trim();
    
    if (message) {
        // Add user message
        const messagesContainer = document.getElementById('chat-messages');
        const messageElement = document.createElement('div');
        messageElement.className = 'ai-message user';
        messageElement.innerHTML = `
            <div class="message-content">${message}</div>
            <div class="message-time">${new Date().toLocaleTimeString()}</div>
        `;
        messagesContainer.appendChild(messageElement);
        
        // Clear input
        input.value = '';
        
        // Process with AI assistant
        if (window.WebsiteAIAssistant) {
            window.WebsiteAIAssistant.processUserMessage(message);
        }
        
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
}

// Initialize AI assistant when page loads
document.addEventListener('DOMContentLoaded', () => {
    if (window.WebsiteAIAssistant) {
        window.WebsiteAIAssistant.updateChatUI = function(role, content) {
            const messagesContainer = document.getElementById('chat-messages');
            if (messagesContainer) {
                const messageElement = document.createElement('div');
                messageElement.className = `ai-message ${role}`;
                messageElement.innerHTML = `
                    <div class="message-content">${content}</div>
                    <div class="message-time">${new Date().toLocaleTimeString()}</div>
                `;
                messagesContainer.appendChild(messageElement);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        };
    }
});
</script>
