<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0c0c0c" />
  <!-- Theme color for browser UI -->
  <title>Checkout | No Limits Beyond Limitations</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&family=Exo+2:wght@300;500;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="css/galaxy.css" />
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #00ffff;
      --secondary: #ff69b4;
      --gold: #ffd700;
      --purple: #8b5cf6;
      --dark: #0c0c0c;
      --light: #ffffff;
      --neon-green: #39ff14;
      --electric-blue: #00d4ff;
    }

    body {
      font-family: 'Exo 2', sans-serif;
      background: var(--dark);
      color: var(--light);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .checkout-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .checkout-header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .checkout-header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 3rem;
      font-weight: 900;
      background: linear-gradient(45deg, var(--primary), var(--secondary), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
      text-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
    }

    .checkout-form {
      background: rgba(139, 92, 246, 0.1);
      border: 2px solid rgba(255, 215, 0, 0.3);
      border-radius: 20px;
      padding: 3rem;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(139, 92, 246, 0.3);
    }

    .form-group {
      margin-bottom: 2rem;
    }

    .form-group label {
      display: block;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      color: var(--gold);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.5);
      border: 2px solid rgba(255, 215, 0, 0.2);
      border-radius: 10px;
      color: var(--light);
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }

    .order-summary {
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 15px;
      padding: 2rem;
      margin-bottom: 2rem;
    }

    .order-summary h3 {
      font-family: 'Orbitron', sans-serif;
      color: var(--gold);
      margin-bottom: 1rem;
      text-transform: uppercase;
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255, 215, 0, 0.2);
    }

    .order-total {
      display: flex;
      justify-content: space-between;
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--gold);
      margin-top: 1rem;
    }

    .checkout-btn {
      width: 100%;
      padding: 1.5rem;
      background: linear-gradient(45deg, var(--purple), var(--secondary));
      border: none;
      border-radius: 15px;
      color: var(--light);
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4);
    }

    .checkout-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(139, 92, 246, 0.6);
    }

    .back-to-shop {
      text-align: center;
      margin-top: 2rem;
    }

    .back-to-shop a {
      color: var(--primary);
      text-decoration: none;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      transition: color 0.3s ease;
    }

    .back-to-shop a:hover {
      color: var(--gold);
    }

    .loading {
      display: none;
      text-align: center;
      padding: 2rem;
    }

    .loading.active {
      display: block;
    }

    .spinner {
      border: 4px solid rgba(255, 215, 0, 0.3);
      border-top: 4px solid var(--gold);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 768px) {
      .checkout-container {
        padding: 1rem;
      }

      .checkout-form {
        padding: 2rem;
      }

      .checkout-header h1 {
        font-size: 2rem;
      }
    }

    /* Promo Section Styles */
    .promo-section {
      background: rgba(255, 215, 0, 0.05);
      border: 2px solid rgba(255, 215, 0, 0.2);
      border-radius: 15px;
      padding: 2rem;
      margin-bottom: 2rem;
    }

    .promo-section h3 {
      font-family: 'Orbitron', sans-serif;
      color: var(--gold);
      margin-bottom: 1rem;
      font-size: 1.2rem;
    }

    #promo-code {
      padding: 0.8rem !important;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    #apply-promo-btn {
      padding: 0.8rem 1.5rem;
      background: linear-gradient(45deg, var(--gold), var(--secondary));
      border: none;
      border-radius: 10px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-left: 0.5rem;
    }

    #apply-promo-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(255, 215, 0, 0.3);
    }

    .promo-message {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: var(--gold);
      font-weight: bold;
    }

    .promo-message.success {
      color: var(--neon-green);
    }

    .promo-message.error {
      color: #ff6b6b;
    }
  </style>
  <!-- Stripe.js -->
  <script src="https://js.stripe.com/v3/"></script>
</head>

<body>
  <div class="checkout-container">
    <div class="checkout-header">
      <h1>🛒 Checkout</h1>
      <p>Complete your order for No Limits Beyond Limitations</p>
    </div>

    <div class="checkout-form">
      <div class="order-summary">
        <h3>Order Summary</h3>
        <div id="order-items">
          <!-- Order items will be populated here -->
        </div>
        <div class="order-total">
          <span>Total:</span>
          <span id="order-total">$0.00</span>
        </div>
      </div>

      <form id="checkout-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required />
        </div>

        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required />
        </div>

        <div class="form-group">
          <label for="address">Shipping Address</label>
          <input type="text" id="address" name="address" required />
        </div>

        <div class="form-group">
          <label for="city">City</label>
          <input type="text" id="city" name="city" required />
        </div>

        <div class="form-group">
          <label for="zip">ZIP Code</label>
          <input type="text" id="zip" name="zip" required />
        </div>

        <div class="promo-section">
          <h3>🎁 Promo Code (Optional)</h3>
          <div class="form-group">
            <input type="text" id="promo-code" placeholder="Enter promo code (e.g., LAUNCH25)" maxlength="50" />
            <button type="button" id="apply-promo-btn" class="btn-secondary">Apply Code</button>
            <div id="promo-message" class="promo-message"></div>
          </div>
        </div>

        <div class="payment-section">
          <h3>💳 Payment Information</h3>

          <!-- Stripe Elements -->
          <div id="card-element">
            <!-- Stripe Elements will create input fields here -->
          </div>

          <div id="card-errors" role="alert"></div>

          <!-- Payment button -->
          <button type="submit" id="submit-button" class="btn-primary">
            <span id="button-text">Pay Now</span>
            <div id="spinner" class="spinner hidden"></div>
          </button>

          <div id="payment-message" class="payment-message"></div>
        </div>

        <div class="loading" id="loading">
          <div class="spinner"></div>
          <p>Processing your order...</p>
        </div>

        <button type="submit" class="checkout-btn" id="checkout-btn">🚀 Complete Order</button>
      </form>
    </div>

    <div class="back-to-shop">
      <a href="shop.html">← Back to Shop</a>
    </div>
  </div>

  <script>
    // Initialize Stripe
    const stripe = Stripe(
      'pk_live_51St8KxGbrgLPuQFwopxDC9rr1o2hYJujJ7ceGP9RgxafShwb5zlt1i96vN9jAcktWLdAsvanJdivugVGWrT1UdlJ00cLbBlzuF'
    );
    const elements = stripe.elements();

    // Create card element
    const cardElement = elements.create('card', {
      style: {
        base: {
          fontSize: '16px',
          color: '#424770',
          '::placeholder': {
            color: '#aab7c4',
          },
        },
      },
    });

    cardElement.mount('#card-element');

    // Handle real-time validation errors
    cardElement.on('change', ({ error }) => {
      const displayError = document.getElementById('card-errors');
      if (error) {
        displayError.textContent = error.message;
      } else {
        displayError.textContent = '';
      }
    });

    // Get order data from URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('product');
    const quantity = urlParams.get('quantity') || 1;

    // Product Catalog State (Populated dynamically)
    let productCatalog = {};

    // Dynamic price calculation for unknown products
    function getProductInfo(productId) {
      if (productCatalog[productId]) {
        return productCatalog[productId];
      }

      // Generate price based on ID for unknown products
      const basePrice = 29.99;
      const variation = (productId % 50) * 2; // $0 to $98 variation
      const price = Math.round((basePrice + variation) * 100) / 100;

      return {
        name: `Product #${productId}`,
        price: price,
      };
    }

    // Populate order summary
    function populateOrderSummary() {
      const orderItems = document.getElementById('order-items');
      const orderTotal = document.getElementById('order-total');

      if (productId) {
        const product = getProductInfo(productId);
        const itemTotal = product.price * quantity;

        orderItems.innerHTML = `
                    <div class="order-item">
                        <span>${product.name} (x${quantity})</span>
                        <span>$${itemTotal.toFixed(2)}</span>
                    </div>
                `;

        orderTotal.textContent = `$${itemTotal.toFixed(2)}`;
      } else {
        orderItems.innerHTML = '<p>No product selected</p>';
        orderTotal.textContent = '$0.00';
      }
    }

    // Handle form submission
    const form = document.getElementById('checkout-form');
    const submitButton = document.getElementById('submit-button');
    const applyPromoBtn = document.getElementById('apply-promo-btn');
    const promoCodeInput = document.getElementById('promo-code');
    const promoMessage = document.getElementById('promo-message');
    let appliedPromoCode = null;

    // Handle promo code button click
    applyPromoBtn.addEventListener('click', () => {
      const promoCode = promoCodeInput.value.trim().toUpperCase();
      if (!promoCode) {
        promoMessage.textContent = '❌ Please enter a promo code';
        promoMessage.classList.remove('success');
        promoMessage.classList.add('error');
        return;
      }

      // For now, just confirm the code was entered (Stripe will validate)
      appliedPromoCode = promoCode;
      promoMessage.textContent = `✅ Promo code "${promoCode}" will be applied at checkout!`;
      promoMessage.classList.remove('error');
      promoMessage.classList.add('success');
    });

    // Allow Enter key to apply promo code
    promoCodeInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        applyPromoBtn.click();
      }
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      setLoading(true);

      // Create payment intent
      const response = await fetch('/api/stripe-payment', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          product_id: productId,
          quantity: quantity,
          promo_code: appliedPromoCode,
          customer_info: {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            address: document.getElementById('address').value,
            city: document.getElementById('city').value,
            zip: document.getElementById('zip').value,
          },
        }),
      });

      const paymentData = await response.json();

      if (paymentData.success) {
        // Confirm payment
        const { error, paymentIntent } = await stripe.confirmCardPayment(
          paymentData.client_secret,
          {
            payment_method: {
              card: cardElement,
              billing_details: {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
              },
            },
          }
        );

        if (error) {
          showMessage(error.message);
          setLoading(false);
        } else {
          // Payment successful
          showMessage('Payment successful! Processing your order...');

          // Create order in system
          setTimeout(() => {
            window.location.href = `success.html?order_id=${paymentIntent.id}`;
          }, 2000);
        }
      } else {
        showMessage(paymentData.error);
        setLoading(false);
      }
    });

    function setLoading(isLoading) {
      submitButton.disabled = isLoading;
      document.getElementById('spinner').classList.toggle('hidden', !isLoading);
      document.getElementById('button-text').textContent = isLoading
        ? 'Processing...'
        : 'Pay Now';
    }

    function showMessage(message) {
      const messageElement = document.getElementById('payment-message');
      messageElement.textContent = message;
      messageElement.classList.remove('hidden');
    }

    // Initialize
    async function initCheckout() {
      try {
        // Sync with the same catalog data the shop uses
        const response = await fetch('/properly-mapped-products.json');
        if (response.ok) {
          const data = await response.json();
          if (data.products) {
            data.products.forEach((p) => {
              productCatalog[p.id] = p;
            });
          }
        }
      } catch (e) {
        console.log('Using procedural fallback for pricing (catalog sync skipped)');
      }
      // Render summary after attempting to load catalog
      populateOrderSummary();
    }

    initCheckout();
  </script>
</body>

</html>
