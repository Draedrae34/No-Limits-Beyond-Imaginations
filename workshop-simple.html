<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Workshop - No Limits Beyond Limitations</title>
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #00ffff;
            font-family: 'Courier New', monospace;
            text-align: center;
            padding: 50px;
            min-height: 100vh;
        }
        .quantum-title {
            font-size: 3rem;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.8);
            margin-bottom: 30px;
            animation: quantumPulse 2s ease-in-out infinite;
        }
        .login-form {
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00ffff;
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            margin: 0 auto;
        }
        .quantum-input {
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00ffff;
            color: #fff;
            padding: 15px;
            border-radius: 10px;
            width: 100%;
            margin: 10px 0;
            font-size: 16px;
        }
        .quantum-btn {
            background: linear-gradient(135deg, #00ffff, #ff00ff);
            border: none;
            color: #000;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
        }
        .quantum-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.8);
        }
        @keyframes quantumPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }
    </style>
</head>
<body>
    <h1 class="quantum-title">🌌 QUANTUM WORKSHOP 🌌</h1>
    
    <div class="login-form">
        <h2>🔐 TRANSCENDENT ACCESS</h2>
        <p style="margin-bottom: 30px;">Enter your quantum credentials</p>
        
        <input type="text" class="quantum-input" placeholder="Username: admin" id="username">
        <input type="password" class="quantum-input" placeholder="Password: nolimits2024" id="password">
        
        <button class="quantum-btn" onclick="login()">
            🚀 ENTER QUANTUM REALM
        </button>
        
        <div id="message" style="margin-top: 20px;"></div>
    </div>
    
    <script>
        function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const message = document.getElementById('message');
            
            if (username === 'admin' && password === 'nolimits2024') {
                message.innerHTML = '🌟 QUANTUM ACCESS GRANTED! Welcome to your transcendent workshop!';
                message.style.color = '#00ff00';
                setTimeout(() => {
                    alert('🚀 Welcome to your Quantum Workshop! Full features coming soon...');
                }, 1000);
            } else {
                message.innerHTML = '❌ Quantum barrier detected. Try admin / nolimits2024';
                message.style.color = '#ff0000';
            }
        }
    </script>
</body>
</html>
