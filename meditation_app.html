<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ZenSpace - Hybrid Meditation & Binaural Studio</title>
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(18, 22, 36, 0.75);
      --accent: #00f2fe;
      --accent-glow: rgba(0, 242, 254, 0.35);
      --text: #f0f4f8;
      --text-dim: #8a99ad;
      --panel-border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Video & Canvas Viewports */
    .viewport-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      overflow: hidden;
    }

    video#bgVideo {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover;
      opacity: 0.85;
      transition: opacity 0.5s ease;
    }

    canvas#canvasVisualizer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      mix-blend-mode: screen;
    }

    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, transparent 30%, rgba(7, 9, 14, 0.85) 100%);
      z-index: 3;
      pointer-events: none;
    }

    /* App UI Controls */
    .app-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 850px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 28px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-dim);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    /* Preset Buttons */
    .presets-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 24px;
    }

    .preset-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--panel-border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s ease;
      text-align: center;
    }

    .preset-btn:hover, .preset-btn.active {
      background: rgba(0, 242, 254, 0.15);
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* Controls Layout */
    .section-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      margin-bottom: 12px;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 4px;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .label-row span.val {
      color: var(--accent);
      font-weight: 600;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      background: rgba(255, 255, 255, 0.1);
      height: 6px;
      border-radius: 3px;
      outline: none;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 10px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--panel-border);
      color: var(--text);
      border-radius: 8px;
      outline: none;
      font-size: 0.9rem;
    }

    .btn-row {
      display: flex;
      gap: 12px;
    }

    button.main-btn {
      flex: 1;
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button.primary {
      background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
      color: #fff;
      box-shadow: 0 4px 20px rgba(0, 114, 255, 0.4);
    }

    button.primary:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    button.secondary {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      border: 1px solid var(--panel-border);
    }

    button.secondary:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    /* Mode Toggles */
    .mode-toggle {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      padding: 4px;
      gap: 4px;
      margin-bottom: 20px;
    }

    .mode-btn {
      flex: 1;
      padding: 8px;
      font-size: 0.85rem;
      border: none;
      background: transparent;
      color: var(--text-dim);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: var(--card-bg);
      color: var(--accent);
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .file-input-wrapper {
      margin-top: 6px;
    }

    .file-input-wrapper input[type="file"] {
      display: none;
    }

    .file-label {
      display: block;
      text-align: center;
      padding: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed var(--panel-border);
      border-radius: 6px;
      font-size: 0.8rem;
      color: var(--text-dim);
      cursor: pointer;
    }

    .file-label:hover {
      border-color: var(--accent);
      color: var(--text);
    }
  </style>
</head>
<body>

  <div class="viewport-container">
    <video id="bgVideo" loop muted playsinline crossorigin="anonymous">
      <source src="https://assets.mixkit.co/videos/preview/mixkit-stars-in-space-background-1610-large.mp4" type="video/mp4" />
    </video>
    <canvas id="canvasVisualizer"></canvas>
    <div class="video-overlay"></div>
  </div>

  <div class="app-container">
    <div class="card">
      <header>
        <h1>ZenSpace Studio</h1>
        <p class="subtitle">Binaural Audio Synthesizer & Dynamic Visual Engine</p>
      </header>

      <div class="mode-toggle">
        <button class="mode-btn active" id="modeBoth">Video + Particle Overlay</button>
        <button class="mode-btn" id="modeVideo">Video Background Only</button>
        <button class="mode-btn" id="modeCanvas">Generative Canvas Only</button>
      </div>

      <div class="presets-row">
        <button class="preset-btn" data-base="150" data-beat="2">Delta (2 Hz - Sleep)</button>
        <button class="preset-btn" data-base="200" data-beat="6">Theta (6 Hz - Deep)</button>
        <button class="preset-btn active" data-base="210" data-beat="10">Alpha (10 Hz - Focus)</button>
        <button class="preset-btn" data-base="250" data-beat="20">Beta (20 Hz - Alert)</button>
        <button class="preset-btn" data-base="300" data-beat="35">Gamma (35 Hz - Insight)</button>
      </div>

      <div class="controls-grid">
        <div class="control-group">
          <div class="section-title">Audio Parameters</div>
          
          <div class="label-row">
            <label for="baseFreq">Base Carrier Frequency</label>
            <span class="val" id="baseFreqVal">210 Hz</span>
          </div>
          <input type="range" id="baseFreq" min="60" max="600" value="210" step="1" />

          <div class="label-row" style="margin-top: 10px;">
            <label for="beatFreq">Binaural Beat Offset</label>
            <span class="val" id="beatFreqVal">10.0 Hz</span>
          </div>
          <input type="range" id="beatFreq" min="0.5" max="40" value="10" step="0.5" />

          <div class="label-row" style="margin-top: 10px;">
            <label for="ambientGain">Ambient Masking Sound (Pink Noise)</label>
            <span class="val" id="ambientVal">20%</span>
          </div>
          <input type="range" id="ambientGain" min="0" max="1" value="0.2" step="0.05" />
        </div>

        <div class="control-group">
          <div class="section-title">Visuals & Timer</div>

          <label style="font-size: 0.85rem; color: var(--text-dim);">Background Video Theme</label>
          <select id="videoSelect">
            <option value="https://assets.mixkit.co/videos/preview/mixkit-stars-in-space-background-1610-large.mp4">Cosmic Stars</option>
            <option value="https://assets.mixkit.co/videos/preview/mixkit-set-of-plateaus-seen-from-the-sky-in-a-sunset-26070-large.mp4">Sunset Sky</option>
            <option value="https://assets.mixkit.co/videos/preview/mixkit-waves-in-the-water-1164-large.mp4">Ocean Water</option>
            <option value="custom">Custom MP4 / Local File</option>
          </select>

          <div class="file-input-wrapper" id="customVideoWrapper" style="display: none;">
            <label class="file-label" for="localVideoInput">📁 Choose Local MP4 File</label>
            <input type="file" id="localVideoInput" accept="video/mp4,video/webm" />
          </div>

          <div class="label-row" style="margin-top: 10px;">
            <label for="sessionTimer">Session Timer</label>
            <span class="val" id="timerVal">Continuous</span>
          </div>
          <select id="sessionTimer">
            <option value="0">Continuous Play</option>
            <option value="5">5 Minutes</option>
            <option value="15">15 Minutes</option>
            <option value="30">30 Minutes</option>
          </select>
        </div>
      </div>

      <div class="btn-row">
        <button class="main-btn primary" id="startBtn">▶ Start Session</button>
        <button class="main-btn secondary" id="stopBtn">⏹ Stop</button>
      </div>
    </div>
  </div>

  <script>
    // --- Audio Engine ---
    class MeditationAudioEngine {
      constructor() {
        this.ctx = null;
        this.oscL = null;
        this.oscR = null;
        this.panL = null;
        this.panR = null;
        this.masterGain = null;
        this.noiseNode = null;
        this.noiseGain = null;
        this.analyser = null;
        this.isPlaying = false;
      }

      init() {
        if (this.ctx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();

        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.3;

        this.analyser = this.ctx.createAnalyser();
        this.analyser.fftSize = 128;

        if (this.ctx.createStereoPanner) {
          this.panL = this.ctx.createStereoPanner();
          this.panR = this.ctx.createStereoPanner();
          this.panL.pan.value = -1.0;
          this.panR.pan.value = 1.0;
        }

        this.masterGain.connect(this.analyser);
        this.analyser.connect(this.ctx.destination);

        // Build Noise Generator for Ambient Masking
        this.initNoiseGenerator();
      }

      initNoiseGenerator() {
        const bufferSize = 2 * this.ctx.sampleRate;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;

        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + white * 0.0555179;
          b1 = 0.99332 * b1 + white * 0.0750759;
          b2 = 0.96900 * b2 + white * 0.1538520;
          b3 = 0.86650 * b3 + white * 0.3104856;
          b4 = 0.55000 * b4 + white * 0.5329522;
          b5 = -0.7616 * b5 - white * 0.0168980;
          output[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
          output[i] *= 0.11;
          b6 = white * 0.115926;
        }

        this.noiseNode = this.ctx.createBufferSource();
        this.noiseNode.buffer = noiseBuffer;
        this.noiseNode.loop = true;

        this.noiseGain = this.ctx.createGain();
        this.noiseGain.gain.value = 0.1;

        this.noiseNode.connect(this.noiseGain);
        this.noiseGain.connect(this.masterGain);
        this.noiseNode.start();
      }

      start(baseFreq, beatFreq, noiseVol) {
        this.init();
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        if (this.isPlaying) this.stopImmediate();

        this.oscL = this.ctx.createOscillator();
        this.oscR = this.ctx.createOscillator();

        this.oscL.type = 'sine';
        this.oscR.type = 'sine';

        const now = this.ctx.currentTime;
        this.oscL.frequency.setValueAtTime(baseFreq, now);
        this.oscR.frequency.setValueAtTime(baseFreq + beatFreq, now);

        if (this.panL && this.panR) {
          this.oscL.connect(this.panL);
          this.panL.connect(this.masterGain);
          this.oscR.connect(this.panR);
          this.panR.connect(this.masterGain);
        } else {
          this.oscL.connect(this.masterGain);
          this.oscR.connect(this.masterGain);
        }

        this.noiseGain.gain.setValueAtTime(noiseVol * 0.25, now);

        this.oscL.start();
        this.oscR.start();
        this.isPlaying = true;
      }

      update(baseFreq, beatFreq, noiseVol) {
        if (!this.isPlaying) return;
        const now = this.ctx.currentTime;
        this.oscL.frequency.setTargetAtTime(baseFreq, now, 0.05);
        this.oscR.frequency.setTargetAtTime(baseFreq + beatFreq, now, 0.05);
        this.noiseGain.gain.setTargetAtTime(noiseVol * 0.25, now, 0.05);
      }

      stopImmediate() {
        if (this.oscL) { this.oscL.stop(); this.oscL.disconnect(); }
        if (this.oscR) { this.oscR.stop(); this.oscR.disconnect(); }
        this.isPlaying = false;
      }

      stop() {
        if (!this.isPlaying) return;
        const now = this.ctx.currentTime;
        this.masterGain.gain.setValueAtTime(this.masterGain.gain.value, now);
        this.masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);

        setTimeout(() => {
          this.stopImmediate();
          this.masterGain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        }, 100);
      }

      getFrequencyData() {
        if (!this.analyser) return new Uint8Array(0);
        const buffer = new Uint8Array(this.analyser.frequencyBinCount);
        this.analyser.getByteFrequencyData(buffer);
        return buffer;
      }
    }

    // --- DOM & Visual State Setup ---
    const bgVideo = document.getElementById('bgVideo');
    const canvas = document.getElementById('canvasVisualizer');
    const ctx = canvas.getContext('2d');

    const baseFreqInput = document.getElementById('baseFreq');
    const beatFreqInput = document.getElementById('beatFreq');
    const ambientGainInput = document.getElementById('ambientGain');
    const baseFreqVal = document.getElementById('baseFreqVal');
    const beatFreqVal = document.getElementById('beatFreqVal');
    const ambientVal = document.getElementById('ambientVal');
    const videoSelect = document.getElementById('videoSelect');
    const customVideoWrapper = document.getElementById('customVideoWrapper');
    const localVideoInput = document.getElementById('localVideoInput');
    const presetBtns = document.querySelectorAll('.preset-btn');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');

    const audioEngine = new MeditationAudioEngine();

    // Resize canvas
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Mode Toggle Logic
    const modeBoth = document.getElementById('modeBoth');
    const modeVideo = document.getElementById('modeVideo');
    const modeCanvas = document.getElementById('modeCanvas');

    let currentMode = 'both';

    function setMode(mode) {
      currentMode = mode;
      [modeBoth, modeVideo, modeCanvas].forEach(b => b.classList.remove('active'));

      if (mode === 'both') {
        modeBoth.classList.add('active');
        bgVideo.style.opacity = '0.85';
        canvas.style.display = 'block';
      } else if (mode === 'video') {
        modeVideo.classList.add('active');
        bgVideo.style.opacity = '1';
        canvas.style.display = 'none';
      } else if (mode === 'canvas') {
        modeCanvas.classList.add('active');
        bgVideo.style.opacity = '0';
        canvas.style.display = 'block';
      }
    }

    modeBoth.addEventListener('click', () => setMode('both'));
    modeVideo.addEventListener('click', () => setMode('video'));
    modeCanvas.addEventListener('click', () => setMode('canvas'));

    // Video Selection Handlers
    videoSelect.addEventListener('change', (e) => {
      if (e.target.value === 'custom') {
        customVideoWrapper.style.display = 'block';
      } else {
        customVideoWrapper.style.display = 'none';
        bgVideo.src = e.target.value;
        bgVideo.play();
      }
    });

    localVideoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        bgVideo.src = URL.createObjectURL(file);
        bgVideo.play();
      }
    });

    // Preset Buttons
    presetBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        presetBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        baseFreqInput.value = btn.dataset.base;
        beatFreqInput.value = btn.dataset.beat;
        syncUI();
      });
    });

    function syncUI() {
      const base = parseFloat(baseFreqInput.value);
      const beat = parseFloat(beatFreqInput.value);
      const ambient = parseFloat(ambientGainInput.value);

      baseFreqVal.textContent = `${base} Hz`;
      beatFreqVal.textContent = `${beat.toFixed(1)} Hz`;
      ambientVal.textContent = `${Math.round(ambient * 100)}%`;

      if (audioEngine.isPlaying) {
        audioEngine.update(base, beat, ambient);
      }
    }

    baseFreqInput.addEventListener('input', syncUI);
    beatFreqInput.addEventListener('input', syncUI);
    ambientGainInput.addEventListener('input', syncUI);

    startBtn.addEventListener('click', () => {
      const base = parseFloat(baseFreqInput.value);
      const beat = parseFloat(beatFreqInput.value);
      const ambient = parseFloat(ambientGainInput.value);

      audioEngine.start(base, beat, ambient);
      bgVideo.play();
    });

    stopBtn.addEventListener('click', () => {
      audioEngine.stop();
    });

    // Particle Visualizer Rendering
    const particles = [];
    for (let i = 0; i < 60; i++) {
      particles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        radius: Math.random() * 3 + 1,
        angle: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.5 + 0.2
      });
    }

    function render() {
      requestAnimationFrame(render);

      if (currentMode === 'video') return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const data = audioEngine.getFrequencyData();
      const avgFreq = data.length ? data.reduce((a, b) => a + b, 0) / data.length : 0;

      // Draw Center Pulsing Ring
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const baseRadius = 80 + (avgFreq * 0.5);

      ctx.save();
      ctx.beginPath();
      ctx.arc(centerX, centerY, baseRadius, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(0, 242, 254, ${0.2 + (avgFreq / 255) * 0.6})`;
      ctx.lineWidth = 3;
      ctx.shadowBlur = 20;
      ctx.shadowColor = '#00f2fe';
      ctx.stroke();
      ctx.restore();

      // Render Floating Particles
      particles.forEach((p, idx) => {
        p.angle += 0.005;
        p.x += Math.cos(p.angle) * p.speed;
        p.y += Math.sin(p.angle) * p.speed;

        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;

        const pulseRadius = p.radius + (avgFreq / 255) * 4;

        ctx.beginPath();
        ctx.arc(p.x, p.y, pulseRadius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0, 242, 254, ${0.4 + (idx % 5) * 0.1})`;
        ctx.fill();
      });
    }

    render();
  </script>
</body>
</html>
