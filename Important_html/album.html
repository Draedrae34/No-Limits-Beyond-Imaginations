<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Album - No Limits Beyond Limitations</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="icon" type="image/png" href="images/favicon-32x32.png" sizes="32x32">
    <link rel="icon" type="image/png" href="images/favicon-16x16.png" sizes="16x16">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <meta name="theme-color" content="#0c0c0c">
    
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            color: #333;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }
        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .gallery img:hover {
            transform: scale(1.05);
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            align-items: center;
            justify-content: center;
        }
        .modal img {
            max-width: 90%;
            max-height: 90%;
        }
        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <img src="logo.png" alt="Logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
            </ul>
        </nav>
    </header>
    <div class="container">
        <h1>My Album</h1>
        <p>Inspiring others through my journey and memories.</p>
        <div class="gallery">
            <!-- Add images from the unzipped directories -->
            <img src="../My clothing mock ups/I Did This For You Brothers/IMG_1464.JPG" alt="Image 1" onclick="openModal(this.src)">
            <img src="../My clothing mock ups/I Did This For You Brothers/IMG_1402.JPG" alt="Image 2" onclick="openModal(this.src)">
            <img src="../My clothing mock ups/I Did This For You Brothers/IMG_1445.JPG" alt="Image 3" onclick="openModal(this.src)">
            <img src="../My clothing mock ups/I Did This For You Brothers/IMG_1459.JPG" alt="Image 4" onclick="openModal(this.src)">
            <img src="../My clothing mock ups/I Did This For You Brothers/IMG_1449.JPG" alt="Image 5" onclick="openModal(this.src)">
            <img src="../My clothing mock ups/I Did This For You Brothers/IMG_1456.JPG" alt="Image 6" onclick="openModal(this.src)">
            <img src="../My clothing mock ups/I Did This For You Brothers/IMG_1455.JPG" alt="Image 7" onclick="openModal(this.src)">
            <img src="../My clothing mock ups/I Did This For You Brothers/IMG_1460.JPG" alt="Image 8" onclick="openModal(this.src)">
            <img src="../My clothing mock ups/I Did This For You Brothers/IMG_1463.PNG" alt="Image 9" onclick="openModal(this.src)">
            <img src="../My clothing mock ups/I Did This For You Brothers/IMG_1463(1).PNG" alt="Image 10" onclick="openModal(this.src)">
            <!-- Add more as needed, but for brevity, stopping here -->
        </div>
    </div>
    <div id="modal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <img id="modal-img" src="">
    </div>
    <script>
        function openModal(src) {
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('modal-img').src = src;
        }
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
