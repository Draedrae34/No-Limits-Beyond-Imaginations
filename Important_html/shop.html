<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Clothing Shop - No Limits Beyond Limitations</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="logo.png" alt="No Limits Logo" class="main-logo">
        </div>
        <nav class="quantum-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html" class="active">Shop</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="shop-section">
            <h1>Custom Clothing Shop</h1>
            <p>Design and order custom apparel with Printful integration</p>

            <!-- Tab Navigation -->
            <div class="tabs">
                <button class="tab-button active" data-tab="shop">Shop</button>
                <button class="tab-button" data-tab="stock">Stock Monitor</button>
                <button class="tab-button" data-tab="tracking">Order Tracking</button>
                <button class="tab-button" data-tab="fulfillment">Fulfillment</button>
            </div>

            <!-- Shop Tab -->
            <div class="tab-content active" id="shop-tab">
                <!-- Product Catalog -->
                <div class="catalog-container">
                <h2>Product Catalog</h2>
                <div id="products-grid" class="products-grid">
                    <!-- Products will be loaded here -->
                </div>
            </div>

            <!-- Order Form -->
            <div class="order-form-container">
                <h2>Create Custom Order</h2>
                <form id="order-form">
                    <div class="form-group">
                        <label for="product-select">Select Product:</label>
                        <select id="product-select" required>
                            <option value="">Choose a product...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="variant-select">Select Variant:</label>
                        <select id="variant-select" required>
                            <option value="">Choose a variant...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="quantity">Quantity:</label>
                        <input type="number" id="quantity" min="1" value="1" required>
                    </div>

                    <div class="form-group">
                        <label for="custom-color">Custom Color (optional):</label>
                        <input type="color" id="custom-color">
                    </div>

                    <div class="form-group">
                        <label for="design-url">Design Image URL:</label>
                        <input type="url" id="design-url" placeholder="https://example.com/design.png" required>
                    </div>

                    <div class="form-group">
                        <label for="design-file">Or Upload Design File:</label>
                        <input type="file" id="design-file" accept="image/*">
                        <div id="upload-status"></div>
                    </div>

                    <div class="form-group">
                        <label for="recipient-name">Recipient Name:</label>
                        <input type="text" id="recipient-name" required>
                    </div>

                    <div class="form-group">
                        <label for="recipient-address">Address:</label>
                        <input type="text" id="recipient-address" required>
                    </div>

                    <div class="form-group">
                        <label for="recipient-city">City:</label>
                        <input type="text" id="recipient-city" required>
                    </div>

                    <div class="form-group">
                        <label for="recipient-zip">ZIP Code:</label>
                        <input type="text" id="recipient-zip" required>
                    </div>

                    <div class="form-group">
                        <label for="recipient-country">Country Code:</label>
                        <input type="text" id="recipient-country" value="US" required>
                    </div>

                    <button type="button" id="estimate-btn">Estimate Order</button>
                    <button type="submit" id="order-btn">Create Order</button>
                </form>

                <div id="estimation-result"></div>
                <div id="order-result"></div>
            </div>

            <!-- Mockup Generator -->
            <div class="mockup-container">
                <h2>Generate Mockups</h2>
                <form id="mockup-form">
                    <div class="form-group">
                        <label for="mockup-product">Product ID:</label>
                        <input type="number" id="mockup-product" placeholder="e.g. 71">
                    </div>

                    <div class="form-group">
                        <label for="mockup-variant">Variant IDs (comma-separated):</label>
                        <input type="text" id="mockup-variant" placeholder="e.g. 4011,4012">
                    </div>

                    <div class="form-group">
                        <label for="mockup-design-url">Design URL:</label>
                        <input type="url" id="mockup-design-url" placeholder="https://example.com/design.png">
                    </div>

                    <button type="submit">Generate Mockup</button>
                </form>

                <div id="mockup-result"></div>
            </div>
            </div> <!-- End Shop Tab -->


            <!-- Stock Monitor Tab -->
            <div class="tab-content" id="stock-tab">
                <h2>Stock Monitoring</h2>
                <button id="refresh-stock">Refresh Stock</button>
                <div id="stock-display"></div>
            </div>

            <!-- Order Tracking Tab -->
            <div class="tab-content" id="tracking-tab">
                <h2>Order Tracking</h2>
                <form id="tracking-form">
                    <div class="form-group">
                        <label for="order-id">Order ID:</label>
                        <input type="text" id="order-id" required>
                    </div>
                    <button type="submit">Track Order</button>
                </form>
                <div id="tracking-result"></div>
            </div>

            <!-- Fulfillment Tab -->
            <div class="tab-content" id="fulfillment-tab">
                <h2>Fulfillment Progress</h2>
                <form id="fulfillment-form">
                    <div class="form-group">
                        <label for="fulfillment-order-id">Order ID:</label>
                        <input type="text" id="fulfillment-order-id" required>
                    </div>
                    <button type="submit">Check Progress</button>
                </form>
                <div id="fulfillment-result"></div>
            </div>
        </section>
    </main>

    <script>
        const API_BASE = 'http://localhost:5000/api';

        // Load products on page load
        document.addEventListener('DOMContentLoaded', loadProducts);

        async function loadProducts() {
            try {
                const response = await fetch(`${API_BASE}/products?limit=20`);
                const data = await response.json();
                displayProducts(data.data);
                populateProductSelect(data.data);
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }

        function displayProducts(products) {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = products.map(product => `
                <div class="product-card">
                    <img src="${product.image}" alt="${product.name}" style="max-width: 200px;">
                    <h3>${product.name}</h3>
                    <p>${product.description}</p>
                    <p>Variants: ${product.variant_count}</p>
                </div>
            `).join('');
        }

        function populateProductSelect(products) {
            const select = document.getElementById('product-select');
            products.forEach(product => {
                const option = document.createElement('option');
                option.value = product.id;
                option.textContent = product.name;
                select.appendChild(option);
            });
        }

        // Handle product selection to load variants
        document.getElementById('product-select').addEventListener('change', async (e) => {
            const productId = e.target.value;
            if (!productId) return;

            try {
                const response = await fetch(`${API_BASE}/products/${productId}/variants`);
                const data = await response.json();
                populateVariantSelect(data.data);
            } catch (error) {
                console.error('Error loading variants:', error);
            }
        });

        function populateVariantSelect(variants) {
            const select = document.getElementById('variant-select');
            select.innerHTML = '<option value="">Choose a variant...</option>';
            variants.forEach(variant => {
                const option = document.createElement('option');
                option.value = variant.id;
                option.textContent = `${variant.name} - ${variant.color || 'N/A'} ${variant.size}`;
                select.appendChild(option);
            });
        }

        // Estimate order
        document.getElementById('estimate-btn').addEventListener('click', async () => {
            const formData = getFormData();
            if (!formData) return;

            try {
                const response = await fetch(`${API_BASE}/order-estimation`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                const data = await response.json();
                document.getElementById('estimation-result').innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                console.error('Error estimating order:', error);
            }
        });

        // Create order
        document.getElementById('order-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = getFormData();
            if (!formData) return;

            try {
                const response = await fetch(`${API_BASE}/orders`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                const data = await response.json();
                document.getElementById('order-result').innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                console.error('Error creating order:', error);
            }
        });

        // Generate mockup
        document.getElementById('mockup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const productId = document.getElementById('mockup-product').value;
            const variantIds = document.getElementById('mockup-variant').value.split(',').map(id => parseInt(id.trim()));
            const designUrl = document.getElementById('mockup-design-url').value;

            const mockupData = {
                products: [{
                    source: 'catalog',
                    catalog_product_id: parseInt(productId),
                    catalog_variant_ids: variantIds,
                    placements: [{
                        placement: 'front',
                        technique: 'dtg',
                        layers: [{
                            type: 'file',
                            url: designUrl
                        }]
                    }]
                }]
            };

            try {
                const response = await fetch(`${API_BASE}/mockups`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(mockupData)
                });
                const data = await response.json();
                document.getElementById('mockup-result').innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                console.error('Error generating mockup:', error);
            }
        });

        // Handle design file upload
        document.getElementById('design-file').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            const statusDiv = document.getElementById('upload-status');
            statusDiv.textContent = 'Uploading...';

            try {
                const response = await fetch(`${API_BASE}/upload-design`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (response.ok) {
                    document.getElementById('design-url').value = data.file_url;
                    statusDiv.textContent = 'Upload successful!';
                    statusDiv.style.color = 'green';
                } else {
                    statusDiv.textContent = `Upload failed: ${data.error}`;
                    statusDiv.style.color = 'red';
                }
            } catch (error) {
                statusDiv.textContent = `Upload error: ${error.message}`;
                statusDiv.style.color = 'red';
            }
        });

        function getFormData() {
            const variantId = document.getElementById('variant-select').value;
            const quantity = document.getElementById('quantity').value;
            const customColor = document.getElementById('custom-color').value;
            const designUrl = document.getElementById('design-url').value;
            const name = document.getElementById('recipient-name').value;
            const address = document.getElementById('recipient-address').value;
            const city = document.getElementById('recipient-city').value;
            const zip = document.getElementById('recipient-zip').value;
            const country = document.getElementById('recipient-country').value;

            if (!variantId || !quantity || !designUrl || !name || !address || !city || !zip || !country) {
                alert('Please fill all required fields');
                return null;
            }

            const orderData = {
                recipient: {
                    name,
                    address1: address,
                    city,
                    zip,
                    country_code: country
                },
                order_items: [{
                    catalog_variant_id: parseInt(variantId),
                    source: 'catalog',
                    quantity: parseInt(quantity),
                    placements: [{
                        placement: 'front',
                        technique: 'dtg',
                        layers: [{
                            type: 'file',
                            url: designUrl
                        }]
                    }]
                }]
            };

            if (customColor) {
                orderData.order_items[0].custom_color = customColor;
            }

            return orderData;
        }

        // Tab switching
        document.querySelectorAll('.tab-button').forEach(button => {
            button.addEventListener('click', () => {
                document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
                button.classList.add('active');
                const tabId = button.getAttribute('data-tab') + '-tab';
                document.getElementById(tabId).classList.add('active');
            });
        });


        // Stock Monitoring
        document.getElementById('refresh-stock').addEventListener('click', async () => {
            try {
                const response = await fetch(`${API_BASE}/stock`);
                const data = await response.json();
                document.getElementById('stock-display').innerHTML = data.map(item => `<p>${item.product}: ${item.stock} available</p>`).join('');
            } catch (error) {
                console.error('Error loading stock:', error);
                document.getElementById('stock-display').innerHTML = '<p>Error loading stock data.</p>';
            }
        });

        // Order Tracking
        document.getElementById('tracking-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const orderId = document.getElementById('order-id').value;

            try {
                const response = await fetch(`${API_BASE}/orders/${orderId}`);
                const data = await response.json();
                document.getElementById('tracking-result').innerHTML = `<p>Status: ${data.status}</p><p>Tracking: ${data.tracking_number || 'N/A'}</p>`;
            } catch (error) {
                console.error('Error tracking order:', error);
                document.getElementById('tracking-result').innerHTML = '<p>Error tracking order.</p>';
            }
        });

        // Fulfillment Progress
        document.getElementById('fulfillment-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const orderId = document.getElementById('fulfillment-order-id').value;

            try {
                const response = await fetch(`${API_BASE}/fulfillment/${orderId}`);
                const data = await response.json();
                const progress = data.progress || 0;
                document.getElementById('fulfillment-result').innerHTML = `
                    <p>Progress: ${progress}%</p>
                    <div style="width:100%; background:#333; height:20px; border-radius:10px;">
                        <div style="width:${progress}%; background:#00ffff; height:20px; border-radius:10px;"></div>
                    </div>
                    <p>Stage: ${data.stage || 'Unknown'}</p>
                `;
            } catch (error) {
                console.error('Error checking fulfillment:', error);
                document.getElementById('fulfillment-result').innerHTML = '<p>Error checking fulfillment.</p>';
            }
        });
    </script>

    <style>
        .shop-section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .catalog-container, .order-form-container, .mockup-container {
            margin-bottom: 40px;
            padding: 20px;
            border: 1px solid #00ffff;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.8);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            border: 1px solid #333;
            padding: 15px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #00ffff;
        }

        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #333;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        button {
            background: linear-gradient(45deg, #FF69B4, #00FFFF);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
        }

        button:hover {
            transform: scale(1.05);
        }

        pre {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
        }

        .tab-button {
            background: rgba(0, 0, 0, 0.8);
            color: #00ffff;
            border: 1px solid #00ffff;
            padding: 10px 20px;
            cursor: pointer;
            margin-right: 5px;
        }

        .tab-button.active {
            background: #00ffff;
            color: black;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #333;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            min-height: 100px;
        }

        @media (max-width: 768px) {
            .tabs {
                flex-direction: column;
            }
            .tab-button {
                margin-bottom: 5px;
                margin-right: 0;
            }
        }
    </style>
</body>
</html>
