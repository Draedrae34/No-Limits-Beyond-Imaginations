<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLBL GALAXY - Official Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {margin:0;padding:0;box-sizing:border-box}
        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a0f3a 50%, #050812 100%);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
        }
        .hero {
            padding: 100px 20px;
            text-align: center;
            background: radial-gradient(circle at 50% 50%, rgba(139,92,246,0.1), transparent 60%);
        }
        .hero h1 {
            font-family: 'Orbitron', monospace;
            font-size: 3.5rem;
            background: linear-gradient(90deg, #00ffff, #ff69b4, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }
        .hero p {
            font-size: 1.3rem;
            color: rgba(255,255,255,0.7);
            max-width: 800px;
            margin: 0 auto;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 30px;
            padding: 40px 20px;
            max-width: 1600px;
            margin: 0 auto;
        }
        .product {
            background: linear-gradient(135deg, rgba(45,27,78,0.6), rgba(26,10,46,0.8));
            border: 1px solid rgba(0,255,255,0.2);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: all 0.4s ease;
        }
        .product:hover {
            transform: translateY(-10px);
            border-color: #00ffff;
            box-shadow: 0 30px 80px rgba(0,255,255,0.15);
        }
        .product img {
            width: 100%;
            height: 300px;
            object-fit: contain;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .product h3 {
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #fff;
        }
        .product .price {
            font-size: 1.5rem;
            font-weight: 900;
            color: #4ecdc4;
            margin-bottom: 15px;
        }
        .product .type {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.6);
            margin-bottom: 15px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #8b5cf6, #ff006e);
            border: none;
            border-radius: 10px;
            color: white;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(139,92,246,0.4);
        }
        .footer {
            padding: 60px 20px;
            text-align: center;
            color: rgba(255,255,255,0.5);
            margin-top: 60px;
        }
        .count {
            background: rgba(139,92,246,0.2);
            padding: 10px 20px;
            border-radius: 10px;
            display: inline-block;
            margin: 20px;
            border: 1px solid rgba(139,92,246,0.4);
        }
        .search-container {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        .search-container input {
            padding: 12px 20px;
            border: 1px solid rgba(0,255,255,0.3);
            border-radius: 25px;
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 16px;
            min-width: 250px;
        }
        .search-container input::placeholder {
            color: rgba(255,255,255,0.6);
        }
        .search-container select {
            padding: 12px 20px;
            border: 1px solid rgba(0,255,255,0.3);
            border-radius: 25px;
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 16px;
        }
        /* Payment Modal Styles */
        .payment-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .payment-modal {
            background: linear-gradient(135deg, rgba(45,27,78,0.95), rgba(26,10,46,0.95));
            border: 1px solid rgba(0,255,255,0.3);
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }
        .payment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .payment-header h3 {
            color: #00ffff;
            margin: 0;
            font-family: 'Orbitron', monospace;
        }
        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .close-btn:hover {
            color: #ff69b4;
        }
        .payment-content {
            padding: 20px;
        }
        .product-info {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
        }
        .product-info h4 {
            margin: 0 0 10px 0;
            color: white;
        }
        .product-info .price {
            font-size: 24px;
            font-weight: bold;
            color: #00ffff;
            margin: 0;
        }
        .payment-container h3 {
            color: #00ffff;
            margin-bottom: 20px;
            text-align: center;
        }
        .card-element, .billing-info {
            margin-bottom: 20px;
        }
        .card-element label, .billing-info label {
            display: block;
            margin-bottom: 8px;
            color: white;
            font-weight: 500;
        }
        #card-element {
            padding: 12px;
            border: 1px solid rgba(0,255,255,0.3);
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
        }
        #card-errors {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 5px;
        }
        .billing-info input {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(0,255,255,0.3);
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: white;
            margin-bottom: 15px;
            font-size: 16px;
        }
        .billing-info input::placeholder {
            color: rgba(255,255,255,0.6);
        }
        .address-row {
            display: flex;
            gap: 15px;
        }
        .address-field {
            flex: 1;
        }
        .pay-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #00ffff, #ff69b4);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .pay-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,255,255,0.3);
        }
        .pay-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
    <script src="https://js.stripe.com/v3/"></script>
    <script defer async src="/_vercel/insights/script.js"></script>
</head>
<body>
    <div class="hero">
        <h1>NLBL GALAXY COLLECTION</h1>
        <p>No Limits Beyond Limitations. Premium products featuring our signature galaxy designs with the NLBL logo.</p>
        <div class="count" id="productCount">Loading...</div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search products..." onkeyup="filterProducts()">
            <select id="categorySelect" onchange="filterProducts()">
                <option value="">All Categories</option>
                <option value="T-Shirts">T-Shirts</option>
                <option value="Hoodies">Hoodies</option>
                <option value="Mugs">Mugs</option>
                <option value="Hats">Hats</option>
                <option value="Posters">Posters</option>
                <option value="Bags">Bags</option>
                <option value="Phone Cases">Phone Cases</option>
                <option value="Other">Other</option>
            </select>
            <select id="sortSelect" onchange="sortProducts()">
                <option value="name">Sort by Name</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
            </select>
        </div>
    </div>

    <div class="products" id="productGrid"></div>

    <div class="footer">
        <p>© 2026 No Limits Beyond Limitations • All products fulfilled by Printify</p>
    </div>

    <script>
        let allProducts = [];

        // Load ALL products from Printify API (shows actual available products)
        async function loadProducts() {
            try {
                const response = await fetch('https://sdj05kp7ut7tfuxh.public.blob.vercel-storage.com/website_products.json');
                const data = await response.json();
                const products = data.products || [];

                // Filter to only show products with images (real products)
                const validProducts = products.filter(p => p.image && p.title);

                // Group by design name to avoid duplicates
                const grouped = {};
                validProducts.forEach(p => {
                    // Extract base name (remove size suffix)
                    const baseName = p.title.replace(/\s*-\s*(S|M|L|XL|2XL|3XL|One Size|Standard|Custom)\s*$/i, '').trim();

                    // Extract category from title
                    let category = 'Other';
                    if (baseName.toLowerCase().includes('shirt') || baseName.toLowerCase().includes('tee')) category = 'T-Shirts';
                    else if (baseName.toLowerCase().includes('hoodie') || baseName.toLowerCase().includes('sweatshirt')) category = 'Hoodies';
                    else if (baseName.toLowerCase().includes('mug') || baseName.toLowerCase().includes('cup')) category = 'Mugs';
                    else if (baseName.toLowerCase().includes('hat') || baseName.toLowerCase().includes('cap')) category = 'Hats';
                    else if (baseName.toLowerCase().includes('poster') || baseName.toLowerCase().includes('print')) category = 'Posters';
                    else if (baseName.toLowerCase().includes('tote') || baseName.toLowerCase().includes('bag')) category = 'Bags';
                    else if (baseName.toLowerCase().includes('phone') || baseName.toLowerCase().includes('case')) category = 'Phone Cases';

                    if (!grouped[baseName]) {
                        grouped[baseName] = {
                            title: baseName,
                            image: p.image,
                            price: p.price,
                            count: 0,
                            productId: p.id,  // Store one product ID for the group
                            category: category
                        };
                    }
                    grouped[baseName].count++;
                });

                const uniqueProducts = Object.values(grouped);
                allProducts = uniqueProducts; // Store for filtering/sorting
                displayProducts(uniqueProducts);
                document.getElementById('productCount').textContent = `${uniqueProducts.length} Products Available`;
            } catch (e) {
                console.error('Error loading products:', e);
                document.getElementById('productCount').textContent = 'Error loading products';
            }
        }

        function displayProducts(products) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            products.forEach(p => {
                const div = document.createElement('div');
                div.className = 'product';
                div.innerHTML = `
                    <img src="${p.image}" alt="${p.title}" loading="lazy">
                    <h3>${p.title}</h3>
                    <div class="type">Multiple Sizes Available</div>
                    <div class="price">$${p.price.toFixed(2)}</div>
                    <button class="btn" onclick="buyProduct('${p.productId}')">SHOP NOW</button>
                `;
                grid.appendChild(div);
            });
        }

        function filterProducts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categorySelect').value;
            const filtered = allProducts.filter(p =>
                p.title.toLowerCase().includes(searchTerm) &&
                (category === '' || p.category === category)
            );
            displayProducts(filtered);
            document.getElementById('productCount').textContent = `${filtered.length} Products Available`;
        }

        function sortProducts() {
            const sortBy = document.getElementById('sortSelect').value;
            let sorted = [...allProducts];

            if (sortBy === 'price-low') {
                sorted.sort((a, b) => a.price - b.price);
            } else if (sortBy === 'price-high') {
                sorted.sort((a, b) => b.price - a.price);
            } else {
                sorted.sort((a, b) => a.title.localeCompare(b.title));
            }

            displayProducts(sorted);
        }

        function buyProduct(productId) {
            // Find the product in our loaded products
            const product = allProducts.find(p => p.productId === productId);
            if (product) {
                stripeProcessor.showPaymentModal(productId, product.price);
            } else {
                alert('Product not found. Please try again.');
            }
        }

        window.onload = loadProducts;
    </script>
    <script src="js/stripe-payment.js"></script>
    </script>
</body>
</html>
