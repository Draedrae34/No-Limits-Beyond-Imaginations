<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />
    <meta name="theme-color" content="#070a16" />
    <meta name="description" content="A simple stereo tone meditation experience." />
    <title>Frequency Meditation | Silent Spirits Legacy</title>
    <style>
      :root { --bg: #070a16; --surface: rgba(19, 25, 49, .8); --line: rgba(148, 163, 184, .18); --sky: #45d4ff; --violet: #9187ff; --ink: #f6f8ff; --muted: #aab5ca; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; overflow-x: hidden; background: radial-gradient(circle at 50% -10%, #172c59 0, var(--bg) 46%); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .55; background-image: radial-gradient(circle at 20% 20%, rgba(255,255,255,.8) 0 1px, transparent 1.5px), radial-gradient(circle at 78% 39%, rgba(255,255,255,.7) 0 1px, transparent 1.5px), radial-gradient(circle at 50% 78%, rgba(255,255,255,.5) 0 1px, transparent 1.5px); background-size: 170px 160px, 230px 240px, 290px 270px; }
      main { position: relative; width: min(100% - 32px, 470px); margin: 0 auto; padding: 32px 0 42px; }
      #visualCanvas { position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; pointer-events: none; }
      main { z-index: 1; }
      .back { display: inline-flex; align-items: center; gap: 7px; margin-bottom: 30px; color: var(--muted); font-size: .85rem; text-decoration: none; }
      .back:hover { color: var(--sky); }
      header { text-align: center; }
      h1 { margin: 0; color: var(--sky); font-size: clamp(1.65rem, 6vw, 2.15rem); letter-spacing: .06em; text-transform: uppercase; }
      .subtitle { max-width: 350px; margin: 9px auto 0; color: var(--muted); font-size: .9rem; line-height: 1.45; }
      .orb-wrap { position: relative; display: grid; place-items: center; width: 214px; height: 214px; margin: 24px auto 26px; }
      .orb-wrap::before, .orb-wrap::after { content: ""; position: absolute; border-radius: 50%; border: 1px solid rgba(86, 211, 255, .24); }
      .orb-wrap::before { width: 170px; height: 170px; animation: orbit 10s linear infinite; }
      .orb-wrap::after { width: 210px; height: 210px; border-color: rgba(145, 135, 255, .17); animation: orbit 16s linear infinite reverse; }
      .orb-glow { position: absolute; width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle, rgba(69,212,255,.35), rgba(69,212,255,.06) 42%, transparent 70%); animation: breathe 4s ease-in-out infinite; }
      .orb { position: relative; z-index: 1; display: grid; place-items: center; width: 112px; height: 112px; border-radius: 50%; background: linear-gradient(145deg, var(--sky), var(--violet)); box-shadow: 0 0 24px rgba(69,212,255,.55), 0 0 64px rgba(110,100,255,.25); color: #071120; font-weight: 800; font-size: 1.15rem; }
      .orb-wrap.playing .orb-glow { animation-duration: 1.75s; }
      @keyframes breathe { 0%,100% { transform: scale(.82); opacity: .5; } 50% { transform: scale(1.08); opacity: 1; } }
      @keyframes orbit { to { transform: rotate(360deg); } }
      .panel { padding: 20px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: 0 18px 50px rgba(0,0,0,.32); backdrop-filter: blur(16px); }
      .status { display: flex; justify-content: space-between; gap: 10px; padding-bottom: 13px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: .82rem; }
      #status { color: var(--sky); font-weight: 650; text-align: right; }
      button { width: 100%; margin-top: 16px; padding: 15px 18px; border: 0; border-radius: 12px; background: linear-gradient(135deg, var(--sky), var(--violet)); box-shadow: 0 8px 25px rgba(69,212,255,.25); color: #071120; cursor: pointer; font: inherit; font-size: 1rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; transition: transform .18s ease, filter .18s ease; }
      button:hover { filter: brightness(1.09); } button:active { transform: scale(.98); } button.playing { background: linear-gradient(135deg, #ff6584, #ed3f64); color: white; }
      .hint { margin: 13px 2px 0; color: var(--muted); font-size: .76rem; line-height: 1.45; text-align: center; }
      .frequencies { display: grid; grid-template-columns: repeat(2, 1fr); gap: 11px; margin-top: 17px; }
      .visual-controls { display: flex; align-items: center; gap: 12px; margin-top: 16px; color: var(--muted); font-size: .78rem; }
      .visual-controls label { flex: 1; } .visual-controls output { color: var(--sky); font-variant-numeric: tabular-nums; }
      .visual-controls input { flex: 2; accent-color: var(--sky); }
      .visual-note { margin: 11px 2px 0; color: var(--muted); font-size: .76rem; text-align: center; }
      .tuning-controls { display: grid; grid-template-columns: 1fr auto; gap: 7px 12px; margin-top: 16px; color: var(--muted); font-size: .78rem; }
      .tuning-controls output { color: var(--sky); font-variant-numeric: tabular-nums; }
      .tuning-controls input { grid-column: 1 / -1; width: 100%; accent-color: var(--sky); }
      .frequency { min-height: 109px; padding: 14px; border: 1px solid transparent; border-radius: 14px; background: var(--surface); color: inherit; cursor: pointer; text-align: left; box-shadow: none; text-transform: none; letter-spacing: normal; font-size: inherit; font-weight: normal; }
      .frequency:hover { border-color: rgba(69,212,255,.45); }
      .frequency.active { border-color: var(--sky); background: rgba(69,212,255,.09); box-shadow: inset 0 0 21px rgba(69,212,255,.06); }
      .frequency strong, .frequency span, .frequency small { display: block; } .frequency strong { font-size: .93rem; } .frequency span { margin-top: 5px; color: var(--sky); font-size: .81rem; font-weight: 700; } .frequency small { margin-top: 5px; color: var(--muted); font-size: .72rem; line-height: 1.3; }
      @media (max-width: 360px) { main { width: min(100% - 22px, 470px); } .frequencies { grid-template-columns: 1fr; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; scroll-behavior: auto !important; } }
    </style>
  </head>
  <body>
    <canvas id="visualCanvas" role="img" aria-label="Slow moving meditation light field"></canvas>
    <main>
      <a class="back" href="/">← Back to Silent Spirits</a>
      <header>
        <h1>Frequency Meditation</h1>
        <p class="subtitle">Stereo tones for a personal meditation session.</p>
      </header>
      <div class="orb-wrap" id="orbWrap" aria-hidden="true"><div class="orb-glow"></div><div class="orb" id="orbText">396 Hz</div></div>
      <section class="panel" aria-label="Audio controls">
        <div class="status"><span>Channel output</span><span id="status">L: 396 Hz · R: 400 Hz</span></div>
        <button id="toggle" type="button" aria-pressed="false">Start frequency</button>
        <p class="hint">Headphones recommended. Keep the volume comfortable and stop if you feel unwell.</p>
        <div class="visual-controls">
          <label for="visualIntensity">Visual intensity <output id="intensityValue">55%</output></label>
          <input id="visualIntensity" type="range" min="0" max="100" value="55" />
        </div>
        <p class="visual-note" id="visualNote">Slow light field: Root</p>
        <div class="tuning-controls" aria-label="Live frequency tuning">
          <label for="baseTone">Base tone <output id="baseToneValue">396 Hz</output></label>
          <input id="baseTone" type="range" min="40" max="1000" value="396" step="1" />
          <label for="beatOffset">Binaural offset <output id="beatOffsetValue">4 Hz</output></label>
          <input id="beatOffset" type="range" min="0.5" max="40" value="4" step="0.5" />
        </div>
      </section>
      <section class="frequencies" id="frequencyGrid" aria-label="Frequency choices"></section>
    </main>
    <script>
      const frequencies = [
        { name: 'Root', baseHz: 396, beatHz: 4, dr: 9, state: 'Delta / Theta' },
        { name: 'Sacral', baseHz: 417, beatHz: 6, dr: 3, state: 'Theta flow' },
        { name: 'Solar Plexus', baseHz: 528, beatHz: 10, dr: 6, state: 'Alpha' },
        { name: 'Heart', baseHz: 639, beatHz: 7, dr: 9, state: 'Theta harmony' },
        { name: 'Throat', baseHz: 741, beatHz: 12, dr: 3, state: 'Alpha' },
        { name: 'Third Eye', baseHz: 852, beatHz: 14, dr: 6, state: 'Beta' },
        { name: 'Crown', baseHz: 963, beatHz: 40, dr: 9, state: 'Gamma' }
      ];
      let activeIndex = 0;
      let audioContext;
      let gain;
      let analyser;
      let analyserData;
      let audioEnergy = 0;
      let leftOscillator;
      let rightOscillator;
      let playing = false;
      const toggle = document.querySelector('#toggle');
      const orbText = document.querySelector('#orbText');
      const orbWrap = document.querySelector('#orbWrap');
      const status = document.querySelector('#status');
      const grid = document.querySelector('#frequencyGrid');
      const visualCanvas = document.querySelector('#visualCanvas');
      const visualContext = visualCanvas.getContext('2d');
      const visualIntensity = document.querySelector('#visualIntensity');
      const intensityValue = document.querySelector('#intensityValue');
      const visualNote = document.querySelector('#visualNote');
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const visualHues = [5, 28, 52, 145, 190, 238, 285];
      let visualParticles = [];
      let intensity = Number(visualIntensity.value) / 100;
      let spectrumData;
      const baseTone = document.querySelector('#baseTone');
      const beatOffset = document.querySelector('#beatOffset');
      const baseToneValue = document.querySelector('#baseToneValue');
      const beatOffsetValue = document.querySelector('#beatOffsetValue');

      function selected() { return frequencies[activeIndex]; }
      function updateReadout() {
        const item = selected();
        orbText.textContent = `${item.baseHz} Hz`;
        visualNote.textContent = `Slow light field: ${item.name}`;
        status.textContent = `L: ${item.baseHz} Hz · R: ${item.baseHz + item.beatHz} Hz`;
        baseTone.value = item.baseHz;
        beatOffset.value = item.beatHz;
        baseToneValue.textContent = `${item.baseHz} Hz`;
        beatOffsetValue.textContent = `${item.beatHz} Hz`;
        document.querySelectorAll('.frequency').forEach((card, index) => {
          card.classList.toggle('active', index === activeIndex);
          card.setAttribute('aria-pressed', String(index === activeIndex));
        });
      }
      function selectFrequency(index) {
        activeIndex = index;
        updateReadout();
        if (!playing) {
          start();
          if (audioContext?.state === 'suspended') audioContext.resume();
          return;
        }
        if (playing) {
          const item = selected();
          const now = audioContext.currentTime;
          leftOscillator.frequency.setTargetAtTime(item.baseHz, now, .04);
          rightOscillator.frequency.setTargetAtTime(item.baseHz + item.beatHz, now, .04);
        }
      }
      function start() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) { toggle.textContent = 'Audio unavailable'; toggle.disabled = true; return; }
        audioContext ??= new AudioContext();
        const item = selected();
        gain = audioContext.createGain();
        gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(.12, audioContext.currentTime + .12);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = .82;
        leftOscillator = audioContext.createOscillator();
        rightOscillator = audioContext.createOscillator();
        leftOscillator.type = rightOscillator.type = 'sine';
        leftOscillator.frequency.setValueAtTime(item.baseHz, audioContext.currentTime);
        rightOscillator.frequency.setValueAtTime(item.baseHz + item.beatHz, audioContext.currentTime);
        if (audioContext.createStereoPanner) {
          const leftPan = audioContext.createStereoPanner(); leftPan.pan.value = -1;
          const rightPan = audioContext.createStereoPanner(); rightPan.pan.value = 1;
          leftOscillator.connect(leftPan).connect(gain); rightOscillator.connect(rightPan).connect(gain);
        } else { leftOscillator.connect(gain); rightOscillator.connect(gain); }
        gain.connect(audioContext.destination);
        gain.disconnect();
        gain.connect(analyser);
        analyser.connect(audioContext.destination);
        analyserData = new Uint8Array(analyser.fftSize);
        leftOscillator.start(); rightOscillator.start();
        playing = true; toggle.textContent = 'Stop frequency'; toggle.classList.add('playing'); toggle.setAttribute('aria-pressed', 'true'); orbWrap.classList.add('playing');
      }
      function stop() {
        if (!playing) return;
        const now = audioContext.currentTime;
        gain.gain.cancelScheduledValues(now); gain.gain.setTargetAtTime(.0001, now, .03);
        leftOscillator.stop(now + .12); rightOscillator.stop(now + .12);
        gain?.disconnect();
        analyser?.disconnect();
        analyser = null;
        leftOscillator = rightOscillator = gain = null;
        playing = false; toggle.textContent = 'Start frequency'; toggle.classList.remove('playing'); toggle.setAttribute('aria-pressed', 'false'); orbWrap.classList.remove('playing');
      }
      frequencies.forEach((item, index) => {
        const card = document.createElement('button'); card.type = 'button'; card.className = 'frequency';
        card.innerHTML = `<strong>${item.name}</strong><span>${item.baseHz} Hz · DR-${item.dr}</span><small>+${item.beatHz} Hz · ${item.state}</small>`;
        card.addEventListener('click', () => selectFrequency(index)); grid.append(card);
      });
      toggle.addEventListener('click', async () => { if (playing) { stop(); } else { start(); if (audioContext?.state === 'suspended') await audioContext.resume(); } });
      window.addEventListener('pagehide', stop);
      visualIntensity.addEventListener('input', () => { intensity = Number(visualIntensity.value) / 100; intensityValue.textContent = `${visualIntensity.value}%`; });
      function resizeVisual() {
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        visualCanvas.width = Math.round(window.innerWidth * ratio);
      baseTone.addEventListener('input', () => {
        frequencies[activeIndex].baseHz = Number(baseTone.value);
        updateReadout(); if (playing) updateOscillators();
      });
      beatOffset.addEventListener('input', () => {
        frequencies[activeIndex].beatHz = Number(beatOffset.value);
        updateReadout(); if (playing) updateOscillators();
      });
        visualCanvas.height = Math.round(window.innerHeight * ratio);
        visualContext.setTransform(ratio, 0, 0, ratio, 0, 0);
        visualParticles = Array.from({ length: Math.max(34, Math.min(70, Math.round(window.innerWidth / 12))) }, () => ({ x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight, size: Math.random() * 1.9 + .4, drift: Math.random() * .6 + .15, phase: Math.random() * Math.PI * 2 }));
      }
      function drawTrackScene(width, height, centerX, centerY, radius, hue, motion, breath) {
        const context = visualContext;
        const glow = `hsla(${hue}, 88%, 75%, ${.34 * intensity})`;
        context.save();
        context.strokeStyle = glow;
        context.fillStyle = `hsla(${hue}, 90%, 70%, ${.13 * intensity})`;
        context.lineWidth = 1.2;
        if (activeIndex === 0) {
          const horizon = height * .72;
          for (let x = -width; x < width * 2; x += 48) {
            context.beginPath(); context.moveTo(centerX + (x - centerX) * .22, horizon); context.lineTo(x, height); context.stroke();
          }
          for (let y = 0; y < 8; y += 1) {
            const depth = horizon + y * y * 8;
            context.beginPath(); context.moveTo(0, depth); context.lineTo(width, depth); context.stroke();
          }
        } else if (activeIndex === 1) {
          for (let wave = 0; wave < 5; wave += 1) {
            context.beginPath();
            for (let x = -20; x <= width + 20; x += 16) {
              const y = centerY + (wave - 2) * 34 + Math.sin(x / 72 + motion * .9 + wave) * (14 + breath * 10);
              x === -20 ? context.moveTo(x, y) : context.lineTo(x, y);
            }
            context.stroke();
          }
        } else if (activeIndex === 2) {
          for (let ray = 0; ray < 24; ray += 1) {
            const angle = ray / 24 * Math.PI * 2 + motion * .08;
            context.beginPath();
            context.moveTo(centerX + Math.cos(angle) * radius * .55, centerY + Math.sin(angle) * radius * .55);
            context.lineTo(centerX + Math.cos(angle) * radius * (1.45 + breath * .25), centerY + Math.sin(angle) * radius * (1.45 + breath * .25));
            context.stroke();
          }
        } else if (activeIndex === 3) {
          const size = radius * .78;
          context.beginPath();
          context.moveTo(centerX, centerY + size * .76);
          context.bezierCurveTo(centerX - size * 1.25, centerY + size * .08, centerX - size * .7, centerY - size * .9, centerX, centerY - size * .28);
          context.bezierCurveTo(centerX + size * .7, centerY - size * .9, centerX + size * 1.25, centerY + size * .08, centerX, centerY + size * .76);
          context.fill(); context.stroke();
        } else if (activeIndex === 4) {
          for (let ribbon = 0; ribbon < 4; ribbon += 1) {
            context.beginPath();
            for (let y = -20; y <= height + 20; y += 18) {
              const x = centerX + (ribbon - 1.5) * 56 + Math.sin(y / 86 + motion * .75 + ribbon) * 26;
              y === -20 ? context.moveTo(x, y) : context.lineTo(x, y);
            }
            context.stroke();
          }
        } else if (activeIndex === 5) {
          context.beginPath(); context.ellipse(centerX, centerY, radius * 1.22, radius * .63, 0, 0, Math.PI * 2); context.stroke();
          context.beginPath(); context.arc(centerX, centerY, radius * (.24 + breath * .08), 0, Math.PI * 2); context.fill(); context.stroke();
        } else {
          for (let point = 0; point < 7; point += 1) {
            const angle = -Math.PI / 2 + point / 7 * Math.PI * 2 + motion * .07;
            const next = -Math.PI / 2 + (point + 3) / 7 * Math.PI * 2 + motion * .07;
            context.beginPath();
            context.moveTo(centerX + Math.cos(angle) * radius * 1.25, centerY + Math.sin(angle) * radius * 1.25);
            context.lineTo(centerX + Math.cos(next) * radius * 1.25, centerY + Math.sin(next) * radius * 1.25);
            context.stroke();
          }
        }
        context.restore();
      }
      function drawFftBars(width, height, hue) {
        if (!playing || !spectrumData?.length) return;
        const bars = Math.min(48, spectrumData.length);
        const barWidth = width / bars;
        const floor = height - 24;
        for (let bar = 0; bar < bars; bar += 1) {
          const start = Math.floor(bar * spectrumData.length / bars);
          const end = Math.floor((bar + 1) * spectrumData.length / bars);
          let peak = 0;
          for (let bin = start; bin < end; bin += 1) peak = Math.max(peak, spectrumData[bin]);
          const barHeight = Math.max(2, peak / 255 * height * .26);
          const x = bar * barWidth;
          const gradient = visualContext.createLinearGradient(0, floor, 0, floor - barHeight);
          if (!spectrumData || spectrumData.length !== analyser.frequencyBinCount) spectrumData = new Uint8Array(analyser.frequencyBinCount);
          analyser.getByteFrequencyData(spectrumData);
          gradient.addColorStop(0, `hsla(${hue}, 94%, 52%, ${.32 * intensity})`);
          gradient.addColorStop(1, `hsla(${(hue + 55) % 360}, 95%, 82%, ${.9 * intensity})`);
          visualContext.fillStyle = gradient;
          visualContext.fillRect(x + 1, floor - barHeight, Math.max(1, barWidth - 2), barHeight);
        }
      }
      function drawVisual(now = 0) {
        const width = window.innerWidth;
        const height = window.innerHeight;
        const item = selected();
        if (analyser && playing) {
          if (!analyserData || analyserData.length !== analyser.fftSize) analyserData = new Uint8Array(analyser.fftSize);
          analyser.getByteTimeDomainData(analyserData);
          let sum = 0;
          for (let sample = 0; sample < analyserData.length; sample += 1) {
            const normalized = (analyserData[sample] - 128) / 128;
            sum += normalized * normalized;
          }
          audioEnergy += (Math.min(1, Math.sqrt(sum / analyserData.length) / .13) - audioEnergy) * .12;
        } else { audioEnergy *= .9; }
        const hue = visualHues[activeIndex];
        const motion = prefersReducedMotion ? 0 : now / 1000;
        const breath = .5 + .5 * Math.sin(motion * (playing ? .55 + item.beatHz / 90 : .2));
        visualContext.clearRect(0, 0, width, height);
        const centerX = width / 2;
        const centerY = height * .42;
        const radius = Math.min(width, height) * (.23 + breath * .08);
        if (playing && analyser) {
          const audioRadius = radius + audioEnergy * 46;
          visualContext.beginPath();
          visualContext.arc(centerX, centerY, audioRadius, 0, Math.PI * 2);
          visualContext.strokeStyle = `hsla(${hue}, 95%, 82%, ${(.22 + audioEnergy * .35) * intensity})`;
          visualContext.lineWidth = 1.5 + audioEnergy * 3;
          visualContext.shadowBlur = 18 + audioEnergy * 24;
          visualContext.shadowColor = `hsl(${hue}, 90%, 70%)`;
          visualContext.stroke(); visualContext.shadowBlur = 0;
        }
        drawTrackScene(width, height, centerX, centerY, radius, hue, motion, breath);
        drawFftBars(width, height, hue);
        const glow = visualContext.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius * 2.2);
        glow.addColorStop(0, `hsla(${hue}, 88%, 62%, ${.16 * intensity})`);
        glow.addColorStop(.42, `hsla(${(hue + 42) % 360}, 85%, 54%, ${.06 * intensity})`);
        glow.addColorStop(1, 'rgba(0,0,0,0)');
        visualContext.fillStyle = glow;
        visualContext.fillRect(0, 0, width, height);
        for (let ring = 0; ring < 3; ring += 1) {
          visualContext.beginPath();
          visualContext.arc(centerX, centerY, radius * (1 + ring * .46 + breath * .08), 0, Math.PI * 2);
          visualContext.strokeStyle = `hsla(${hue}, 82%, 70%, ${(.16 - ring * .035) * intensity})`;
          visualContext.lineWidth = 1;
          visualContext.stroke();
        }
        visualParticles.forEach((particle) => {
          const sway = Math.sin(motion * particle.drift + particle.phase) * 18;
          const alpha = (.13 + .26 * (Math.sin(motion * .45 + particle.phase) + 1) / 2) * intensity;
          visualContext.beginPath();
          visualContext.arc(particle.x + sway, particle.y - motion * particle.drift * 3 % (height + 30), particle.size, 0, Math.PI * 2);
          visualContext.fillStyle = `hsla(${hue}, 88%, 83%, ${alpha})`;
          visualContext.fill();
        });
        if (!prefersReducedMotion) requestAnimationFrame(drawVisual);
      }
      window.addEventListener('resize', resizeVisual);
      updateReadout();
      resizeVisual();
      drawVisual();
    </script>
  </body>
</html>
