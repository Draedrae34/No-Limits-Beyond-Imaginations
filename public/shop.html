<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>No Limits Beyond Limitations – Cosmic Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="epic-theme.css" />
  <link rel="stylesheet" href="portal-overlay.css" />
  <link rel="stylesheet" href="cinematic-transitions.css" />
  <link rel="stylesheet" href="galaxy-particles.css" />
  <link rel="stylesheet" href="cosmic-sounds.css" />
  <link rel="stylesheet" href="css/shop.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body class="nlbl-body">
  <!-- Cosmic Background -->
  <div id="cosmic-background">
    <canvas id="cosmic-canvas"></canvas>
    <div class="cosmic-vortex-overlay"></div>
  </div>

  <!-- Page Wrapper -->
  <div class="nlbl-page">

    <!-- Hero Section -->
    <header class="shop-hero">
      <div class="shop-hero-inner">
        <div class="shop-hero-badge">No Limits Beyond Limitations</div>
        <h1 class="shop-hero-title">
          Born From Memory.<br />
          Forged in the Stars.<br />
          <span class="shop-hero-highlight">Beyond Every Limit.</span>
        </h1>
        <p class="shop-hero-subtitle">
          A cosmic collection crafted from grief, grit, and galaxies. Every piece carries a story, a spark, and a promise:
          there is no end to what we can become.
        </p>

        <div class="shop-hero-actions">
          <button class="btn-primary" data-scroll-target="#shop-grid">
            Enter the Cosmic Vault
          </button>
          <button class="btn-ghost" id="memorial-mode-toggle">
            Memorial Mode: <span id="memorial-mode-label">Off</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Filters -->
    <section class="shop-filters">
      <div class="shop-filters-inner">
        <div class="shop-filter-group">
          <span class="shop-filter-label">Filter by Category</span>
          <div id="category-filters" class="filter-pill-row">
            <!-- Filled dynamically -->
          </div>
        </div>
        <div class="shop-filter-group">
          <span class="shop-filter-label">Search</span>
          <input type="text" id="product-search" class="shop-search-input" placeholder="Search the cosmos…" />
        </div>
      </div>
    </section>

    <!-- Product Grid -->
    <main class="shop-main">
      <section id="shop-grid" class="shop-grid">
        <!-- Product cards injected here -->
      </section>
    </main>

    <!-- Product Modal -->
    <div id="product-modal" class="modal-backdrop hidden">
      <div class="modal">
        <button class="modal-close" id="modal-close-btn">&times;</button>
        <div class="modal-content">
          <div class="modal-image-wrap">
            <img id="modal-image" src="" alt="" />
          </div>
          <div class="modal-details">
            <h2 id="modal-title"></h2>
            <p id="modal-description"></p>
            <div class="modal-tags" id="modal-tags"></div>
            <div class="modal-price-row">
              <span class="modal-price" id="modal-price"></span>
            </div>
            <button class="btn-primary" id="modal-add-to-cart">
              Add to Cart
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Floating Cart Icon (visual only for now) -->
    <button id="floating-cart" class="floating-cart">
      <span class="cart-icon">🛒</span>
      <span id="cart-count" class="cart-count">0</span>
    </button>

  </div>

  <!-- Scripts -->
  <script src="js/cosmic-background.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
