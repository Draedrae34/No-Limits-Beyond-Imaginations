<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop Access | Silent Spirits Legacy</title>
    <link rel="stylesheet" href="css/workshop.css">
</head>
<body class="workshop-body">
    <div id="cosmic-intro" style="opacity: 1; visibility: visible;">
        <h2>ASCENSION KEY PRIVATE WORKSHOP ACCESS</h2>
        <p>Engage Portal – Subsystems Ready</p>
        <button id="login-btn" class="action-btn" style="margin-top: 2rem; padding: 1rem 2rem; font-size: 1.2rem; cursor: pointer;">Engage Portal</button>
    </div>

    <script>
        document.getElementById('login-btn').addEventListener('click', async () => {
            try {
                // Trigger the master bypass cookie from /api/auth.js
                const response = await fetch('/api/auth', { method: 'POST' });
                if (response.ok) {
                    // Redirect to the actual workshop dashboard
                    window.location.href = 'workshop.html';
                }
            } catch (err) {
                console.error("Portal error:", err);
                window.location.href = 'workshop.html';
            }
        });
    </script>
</body>
</html>
