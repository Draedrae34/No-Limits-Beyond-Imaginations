<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop Access | Silent Spirits Legacy</title>
    <link rel="stylesheet" href="/css/workshop.css">
</head>
<body class="workshop-body">
    <div id="cosmic-intro" class="auth-shell">
        <div class="auth-card">
            <h2>PRIVATE WORKSHOP ACCESS</h2>
            <p>Unlock Lil Mystic and enter your production workshop.</p>
            <form id="login-form" class="auth-form">
                <label for="password">Passcode</label>
                <input id="password" name="password" type="password" placeholder="Enter private passcode" autocomplete="current-password">
                <div class="auth-actions">
                    <button type="submit" class="action-btn">Enter Workshop</button>
                </div>
                <p id="error-message" class="error-text"></p>
            </form>
        </div>
    </div>

    <script src="/js/auth.js"></script>
</body>
</html>
