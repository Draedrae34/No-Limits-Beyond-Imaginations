<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NLBL Workshop – Lil Mystic Control Center</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
   <link rel="preconnect" href="https://fonts.googleapis.com" />
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
   <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
   <link rel="stylesheet" href="css/shop.css" />
   <link rel="stylesheet" href="css/animations.css" />
   <style>
     body.nlbl-body { display: flex; flex-direction: column; min-height: 100vh; background: radial-gradient(circle at top, #0b1020, #02030a); }
     .workshop-shell { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 1.5rem; width: 100%; max-width: 1400px; margin: 2rem auto; padding: 1.5rem; color: #f5f5ff; position: relative; }
     .workshop-panel { background: rgba(5, 8, 20, 0.85); border-radius: 18px; border: 1px solid rgba(120, 120, 255, 0.35); box-shadow: 0 0 40px rgba(80, 80, 255, 0.25); padding: 1.25rem 1.5rem; backdrop-filter: blur(18px); }
     .workshop-panel h2 { font-size: 1.1rem; letter-spacing: 0.08em; text-transform: uppercase; color: #a7b3ff; margin-bottom: 0.75rem; }
     .workshop-section-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.12em; color: #7f8cff; margin: 1rem 0 0.4rem; }
     .workshop-products-list { max-height: 320px; overflow: auto; border-radius: 12px; border: 1px solid rgba(120, 120, 255, 0.25); padding: 0.5rem; background: radial-gradient(circle at top left, rgba(90, 90, 255, 0.12), rgba(5, 8, 20, 0.9)); }
     .workshop-product-row { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem 0.5rem; border-radius: 8px; font-size: 0.85rem; }
     .workshop-product-row:nth-child(odd) { background: rgba(255, 255, 255, 0.01); }
     .workshop-product-row span { opacity: 0.9; }
     .workshop-tools-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.5rem; margin-top: 0.5rem; }
     .workshop-tool-btn { font-size: 0.8rem; padding: 0.55rem 0.7rem; border-radius: 999px; border: 1px solid rgba(140, 140, 255, 0.5); background: radial-gradient(circle at top, rgba(120, 120, 255, 0.2), rgba(5, 8, 20, 0.9)); color: #f5f5ff; cursor: pointer; text-align: left; }
     .workshop-tool-btn:hover { border-color: #ffffff; box-shadow: 0 0 18px rgba(140, 140, 255, 0.7); }
     .mystic-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
     .mystic-orb { width: 32px; height: 32px; border-radius: 999px; background: radial-gradient(circle at 30% 20%, #ff9cfb, #7f5dff 40%, #1b0f3b 70%); box-shadow: 0 0 18px rgba(255, 140, 255, 0.9); animation: pulse-orb 2.4s ease-in-out infinite; }
     .mystic-status { font-size: 0.8rem; color: #c9d0ff; opacity: 0.9; }
     .mystic-chat-log { max-height: 360px; overflow: auto; padding: 0.75rem; border-radius: 12px; border: 1px solid rgba(140, 140, 255, 0.35); background: radial-gradient(circle at top right, rgba(255, 160, 255, 0.12), rgba(5, 8, 20, 0.95)); font-size: 0.85rem; }
     .mystic-msg { margin-bottom: 0.6rem; line-height: 1.4; }
     .mystic-msg-user { color: #e0e6ff; }
     .mystic-msg-ai { color: #ffd6ff; }
     .mystic-input-row { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
     .mystic-input-row input { flex: 1; border-radius: 999px; border: 1px solid rgba(140, 140, 255, 0.6); padding: 0.55rem 0.8rem; background: rgba(5, 8, 20, 0.9); color: #f5f5ff; font-size: 0.85rem; }
     .mystic-input-row button { border-radius: 999px; border: none; padding: 0.55rem 0.9rem; background: linear-gradient(135deg, #ff9cfb, #7f5dff); color: #050814; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
     @keyframes pulse-orb { 0%, 100% { transform: scale(1); box-shadow: 0 0 14px rgba(255, 160, 255, 0.7); } 50% { transform: scale(1.08); box-shadow: 0 0 26px rgba(255, 200, 255, 1); } }

     /* Cosmic background */
     .cosmic-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: radial-gradient(ellipse at top, #0b1020 0%, #02030a 100%); }
     #starfield { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

     /* 3D Hologram Container */
     .hologram-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
     #lil-mystic-canvas { width: 100%; height: 100%; }

     /* Floating UI Panels */
     .floating-panel { position: fixed; background: rgba(5, 8, 20, 0.85); border: 1px solid rgba(120, 120, 255, 0.4); border-radius: 16px; padding: 1rem; backdrop-filter: blur(16px); box-shadow: 0 0 30px rgba(80, 80, 255, 0.3); z-index: 10; transition: all 0.3s ease; }
     .floating-panel:hover { border-color: rgba(140, 140, 255, 0.7); box-shadow: 0 0 40px rgba(100, 100, 255, 0.5); }
     .floating-panel h3 { margin: 0 0 0.5rem 0; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: #a7b3ff; }
     .floating-panel ul { list-style: none; padding: 0; margin: 0; font-size: 0.8rem; color: #c9d0ff; }
     .floating-panel li { margin-bottom: 0.3rem; opacity: 0.9; }

     /* Specific floating panel positions */
     #catalog-panel { top: 100px; right: 20px; width: 280px; max-height: 400px; overflow: auto; }
     #orders-panel { top: 100px; left: 20px; width: 280px; max-height: 400px; overflow: auto; }
     #alerts-panel { bottom: 80px; right: 20px; width: 300px; max-height: 300px; overflow: auto; }
     #metrics-panel { bottom: 80px; left: 20px; width: 260px; max-height: 300px; overflow: auto; }

     /* Status Strip */
     .status-strip { width: 100%; padding: 0.5rem 1.5rem; display: flex; align-items: center; gap: 1rem; font-size: 0.85rem; background: rgba(5, 8, 20, 0.95); border-bottom: 1px solid rgba(120, 120, 255, 0.2); position: relative; z-index: 100; }
     .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #666; box-shadow: 0 0 8px #666; }
     .status-dot.green { background: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
     .status-dot.yellow { background: #f1c40f; box-shadow: 0 0 8px #f1c40f; }
     .status-dot.red { background: #e74c3c; box-shadow: 0 0 8px #e74c3c; }
     .status-text { color: #a7b3ff; font-family: 'Space Grotesk', monospace; }

     /* Audit panel */
     .audit-panel { display: none; margin-top: 1rem; padding: 0.75rem; border-radius: 10px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(120, 120, 255, 0.15); font-size: 0.8rem; overflow: auto; max-height: 200px; }
     .audit-panel.visible { display: block; }
     .audit-json { white-space: pre-wrap; color: #a7d5ff; font-family: 'Space Grotesk', monospace; line-height: 1.4; }
     .audit-json .key { color: #ff9cfb; }
     .audit-json .string { color: #a7d5ff; }
     .audit-json .number { color: #f1c40f; }
     .audit-json .boolean { color: #2ecc71; }
   </style>
</head>
<body class="nlbl-body">
   <div class="status-strip">
     <div class="status-dot" id="health-dot"></div>
     <span class="status-text" id="health-text">Initializing…</span>
   </div>

   <!-- 3D Hologram Background -->
   <div class="hologram-container">
     <canvas id="lil-mystic-canvas"></canvas>
   </div>

   <!-- Floating Panels -->
   <div class="floating-panel" id="catalog-panel">
     <h3>📦 Catalog Status</h3>
     <ul id="catalog-stats">
       <li>Loading…</li>
     </ul>
   </div>

   <div class="floating-panel" id="orders-panel">
     <h3>📋 Recent Orders</h3>
     <ul id="orders-list">
       <li>No recent orders</li>
     </ul>
   </div>

   <div class="floating-panel" id="alerts-panel">
     <h3>⚡ Live Alerts</h3>
     <ul id="alerts-list">
       <li>System ready</li>
     </ul>
   </div>

   <div class="floating-panel" id="metrics-panel">
     <h3>📊 Metrics</h3>
     <ul id="metrics-list">
       <li>Latency: --</li>
       <li>Cache: --</li>
     </ul>
   </div>

   <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
   <script src="js/starfield.js"></script>
   <script src="js/lil-mystic-3d.js"></script>
   <script src="js/lil-mystic.js"></script>
   <script src="js/workshop.js"></script>
   <script src="js/workshop-heartbeat.js"></script>
</body>
</html>
