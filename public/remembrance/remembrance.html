<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>R & T — Remembrance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Styles -->
  <link rel="stylesheet" href="../epic-theme.css" />
  <link rel="stylesheet" href="../portal-overlay.css" />
  <link rel="stylesheet" href="../cinematic-transitions.css" />
  <link rel="stylesheet" href="../galaxy-particles.css" />
  <link rel="stylesheet" href="../cosmic-sounds.css" />
  <link rel="stylesheet" href="remembrance.css" />

</head>
<body class="epic-remembrance">

    <!-- Cosmic Background -->
    <div class="cosmic-bg">
        <canvas id="star-canvas"></canvas>
    </div>

    <!-- Opening Overlay -->
  <div id="opening-overlay">
    <div class="overlay-content">
      <h1>In Loving Memory</h1>
      <p>Forever remembered. Never forgotten.</p>
      <p style="margin-top: 30px; font-size: 0.8rem; color: #ffd700; letter-spacing: 2px; text-transform: uppercase;">Tap to enter the sacred space</p>
    </div>
  </div>

  <nav class="remembrance-nav" style="position: fixed; top: 20px; right: 20px; z-index: 1000; display: flex; gap: 10px;">
    <a href="../index.html" class="nav-btn" style="background: rgba(125, 44, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.1); color: white; padding: 10px 20px; border-radius: 50px; text-decoration: none; font-family: 'Orbitron', sans-serif; font-size: 0.7rem; backdrop-filter: blur(10px); transition: 0.3s;">Home</a>
    <a href="../message-wall.html" class="nav-btn" style="background: rgba(125, 44, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.1); color: white; padding: 10px 20px; border-radius: 50px; text-decoration: none; font-family: 'Orbitron', sans-serif; font-size: 0.7rem; backdrop-filter: blur(10px); transition: 0.3s;">Honor Wall</a>
  </nav>

  <main style="max-width: 1200px; margin: 0 auto; padding: 120px 20px 60px;">
    <!-- Hero Section -->
    <section class="hero" style="text-align: center; margin-bottom: 60px; padding: 40px;">
        <h1 style="font-family: 'Orbitron'; font-size: clamp(2rem, 5vw, 4rem); background: linear-gradient(90deg, #fff, #c4b5fd); -webkit-background-clip: text; color: transparent;">Silent Spirits Legacy</h1>
        <p class="subtitle" style="color: #a78bfa; letter-spacing: 2px; text-transform: uppercase;">A journey through memory and light</p>
    </section>

  </main>

  <!-- Scripts -->
  <script src="remembrance.js"></script>

  <!-- Star canvas background animation -->
  <script>
    if (document.getElementById('star-canvas')) {
      (function() {
        const canvas = document.getElementById('star-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const stars = [];
        const starCount = 200;
        for (let i = 0; i < starCount; i++) {
          stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2,
            speed: Math.random() * 0.5 + 0.1,
            opacity: Math.random() * 0.5 + 0.3,
          });
        }
        function animateStars() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          for (let star of stars) {
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255,255,255,${star.opacity})`;
            ctx.fill();
            star.y -= star.speed;
            if (star.y < 0) {
              star.y = canvas.height;
              star.x = Math.random() * canvas.width;
            }
          }
          requestAnimationFrame(animateStars);
        }
        animateStars();
      })();
    }
  </script>

</body>
</html>
