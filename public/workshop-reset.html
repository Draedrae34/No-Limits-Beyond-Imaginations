<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workshop Password Reset</title>
  <link rel="stylesheet" href="/css/workshop.css">
</head>
<body class="workshop-body">
  <div id="reset-shell" class="auth-shell">
    <div class="auth-card">
      <h2>Hidden Workshop Password Reset</h2>
      <p>Enter your hidden reset code and choose a new workshop password.</p>
      <form id="reset-form" class="auth-form">
        <label for="resetCode">Reset Code</label>
        <input id="resetCode" name="resetCode" type="password" placeholder="Enter hidden reset code" autocomplete="off" required>

        <label for="newPassword">New Workshop Password</label>
        <input id="newPassword" name="newPassword" type="password" placeholder="New password" autocomplete="new-password" required>

        <label for="confirmPassword">Confirm New Password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm password" autocomplete="new-password" required>

        <div class="auth-actions">
          <button type="submit" class="action-btn">Reset Password</button>
        </div>
        <p id="reset-message" class="error-text"></p>
      </form>
      <p class="small-text">This page is intentionally hidden. Only use it if you know the reset code.</p>
    </div>
  </div>

  <script src="/js/workshop-reset.js"></script>
</body>
</html>
