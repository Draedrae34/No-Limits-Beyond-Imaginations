<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silent Spirits Legacy | Honor Wall</title>
    <link rel="stylesheet" href="css/message-wall.css"> <!-- Dedicated CSS for public Honor Wall -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=Playfair+Display:ital,wght@1,700&family=Pacifico&family=Oswald:wght@700&display=swap" rel="stylesheet">
</head>

<body class="honor-wall-body">

    <!-- Cosmic Background -->
    <div id="cosmic-bg">
        <canvas id="starfield"></canvas>
        <div class="nebula-layer"></div>
        <div class="fog-layer"></div>
    </div>

    <!-- HONOR WALL INTRO (GUARANTEED VERSION) -->
    <section class="honor-intro">

        <!-- DOG TAGS (GUARANTEED TO SHOW) -->
        <img src="images/dogtags.png" class="dogtag-fade honor-dogtags" alt="Dog Tags">

        <!-- TITLE -->
        <h1>Honor Wall</h1>

        <!-- TRIBUTE POEM (GUARANTEED TO SHOW) -->
        <p class="honor-poem">
            Every message left here becomes a star in their sky.<br>
            Your words, your art, your memories — all part of the legacy.
        </p>

    </section>

    <!-- Tribute Composer -->
    <section class="tribute-composer">
        <div class="composer-controls">
            <h2>Create Your Tribute</h2>

            <label>
                Message Text
                <textarea id="tribute-text" rows="3" placeholder="Write your message, poem, or tribute..."></textarea>
            </label>

            <label>
                Font
                <select id="tribute-font">
                    <option value="'Space Grotesk', system-ui">Cosmic Sans</option>
                    <option value="'Playfair Display', serif">Elegant Serif</option>
                    <option value="'Pacifico', cursive">Handwritten Script</option>
                    <option value="'Oswald', sans-serif">Bold Block</option>
                </select>
            </label>

            <label>
                Text Color
                <input type="color" id="tribute-color" value="#f5e9ff">
            </label>

            <label>
                Style
                <select id="tribute-style">
                    <option value="glow">Glow</option>
                    <option value="shadow">Shadow</option>
                    <option value="outline">Outline</option>
                </select>
            </label>

            <label>
                Upload Tribute Image (optional)
                <input type="file" id="tribute-image" accept="image/*">
            </label>

            <button id="submit-tribute">Submit Tribute</button>
        </div>

        <div class="composer-preview">
            <h3>Live Preview</h3>
            <div id="tribute-preview" class="tribute-preview-card">
                <p class="preview-text">Your tribute will appear here.</p>
                <img id="preview-image" alt="" style="display:none;">
            </div>
        </div>
    </section>

    <!-- Honor Wall Grid -->
    <section class="honor-grid-section">
        <h2>Community Tributes</h2>
        <div id="honor-grid" class="honor-grid">
            <!-- API tributes will render here -->
        </div>
    </section>

    <script src="js/starfield.js"></script> <!-- Assuming starfield.js exists and initializes itself or has an init function -->
    <script src="js/message-wall.js"></script> <!-- Dedicated JS for public Honor Wall logic -->

</body>
</html>
