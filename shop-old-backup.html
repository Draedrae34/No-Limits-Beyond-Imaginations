<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0c0c0c">
    <title>Quantum Shop | No Limits Beyond Limitations</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&family=Exo+2:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/galaxy.css">
    <script src="js/printify-shop.js"></script>
    <script src="https://js.stripe.com/v3/"></script>
    <script src="js/stripe-payment.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #00FFFF;
            --secondary: #FF69B4;
            --gold: #FFD700;
            --purple: #8B5CF6;
            --dark: #0c0c0c;
            --light: #ffffff;
            --neon-green: #39FF14;
            --electric-blue: #00D4FF;
        }

        body {
            font-family: 'Exo 2', sans-serif;
            background: var(--dark);
            color: var(--light);
            min-height: 100vh;
            overflow-x: hidden;
            cursor: none;
        }

        /* Quantum Cursor */
        .quantum-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid var(--primary);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            transition: all 0.1s ease;
            box-shadow: 0 0 20px var(--primary);
        }

        .quantum-cursor::after {
            content: '';
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--primary);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Advanced Cosmic Background */
        .quantum-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(139, 92, 246, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(0, 255, 255, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 105, 180, 0.2) 0%, transparent 50%),
                linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 25%, #16213e 50%, #0f3460 75%, #0c0c0c 100%);
            z-index: -2;
            animation: quantumShift 20s ease infinite;
        }

        @keyframes quantumShift {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.1) rotate(1deg); }
            50% { transform: scale(1.05) rotate(-1deg); }
            75% { transform: scale(1.02) rotate(0.5deg); }
        }

        /* Floating Particles */
        .quantum-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--primary);
            border-radius: 50%;
            opacity: 0.6;
            animation: float 15s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-100vh) translateX(100px); opacity: 0; }
        }

        /* Navigation Header */
        .quantum-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(12, 12, 12, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
            z-index: 1000;
            padding: 20px 0;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .quantum-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--primary), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .nav-actions {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .quantum-btn {
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .quantum-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: var(--primary);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.3s ease;
        }

        .quantum-btn:hover::before {
            width: 100%;
            height: 100%;
        }

        .quantum-btn:hover {
            color: var(--dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.5);
        }

        .quantum-btn span {
            position: relative;
            z-index: 1;
        }

        /* Main Container */
        .quantum-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 120px 20px 100px;
        }

        /* Hero Section */
        .quantum-hero {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
        }

        .quantum-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--primary), var(--secondary), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 20px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.5)); }
            to { filter: drop-shadow(0 0 30px rgba(255, 105, 180, 0.8)); }
        }

        .quantum-subtitle {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
        }

        /* Category Navigation */
        .quantum-categories {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .type-filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .type-filter-bar button {
            padding: 0.45rem 1.2rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: transparent;
            color: var(--light);
            font-family: "Orbitron", sans-serif;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s ease, border 0.3s ease, color 0.3s ease;
        }

        .type-filter-bar button.active {
            background: rgba(0, 255, 255, 0.25);
            border-color: var(--primary);
            color: var(--dark);
        }

        .category-card {
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 20px;
            padding: 30px;
            min-width: 200px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .category-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(139, 92, 246, 0.3), transparent);
            transform: rotate(45deg);
            transition: all 0.5s ease;
            opacity: 0;
        }

        .category-card:hover::before {
            animation: shimmer 0.5s ease;
            opacity: 1;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .category-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 20px 40px rgba(0, 255, 255, 0.3);
        }

        .category-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            display: block;
        }

        .category-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .category-count {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
        }

        /* Products Grid */
        .quantum-products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        /* Printify Products */
        .product-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.3);
            border-color: var(--primary);
        }

        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .product-card h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .product-card .price {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 15px;
        }

        .buy-btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: var(--dark);
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .buy-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0, 255, 255, 0.4);
        }

        /* Stripe Payment Modal */
        .payment-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .payment-modal {
            background: linear-gradient(135deg, var(--dark), #1a1a2e);
            border: 2px solid var(--primary);
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 255, 255, 0.3);
        }

        .payment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .payment-header h3 {
            color: var(--primary);
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--light);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
        }

        .payment-content {
            display: flex;
            gap: 20px;
        }

        .product-info {
            flex: 1;
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .product-info h4 {
            color: var(--gold);
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 10px;
        }

        .product-info .price {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
        }

        .payment-container {
            flex: 2;
        }

        .payment-container h3 {
            color: var(--light);
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 20px;
            text-align: center;
        }

        .card-element {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 20px;
        }

        #card-errors {
            color: #ff6b6b;
            text-align: center;
            margin-bottom: 15px;
        }

        .billing-info {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .billing-info label {
            color: var(--light);
            font-weight: 500;
            margin-bottom: 5px;
        }

        .billing-info input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--light);
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }

        .billing-info input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }

        .address-row {
            display: flex;
            gap: 15px;
        }

        .address-field {
            flex: 1;
        }

        .pay-btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: var(--dark);
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
        }

        .pay-btn:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(0, 255, 255, 0.4);
        }

        .pay-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-loading {
            display: none;
        }

        .quantum-product {
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
        }

        .quantum-product::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--gold));
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .quantum-product:hover::before {
            transform: scaleX(1);
        }

        .quantum-product:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: 0 30px 60px rgba(0, 255, 255, 0.4);
        }

        .product-image-container {
            height: 300px;
            overflow: hidden;
            position: relative;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), rgba(0, 255, 255, 0.1));
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .quantum-product:hover .product-image {
            transform: scale(1.1);
        }

        .product-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, transparent, rgba(12, 12, 12, 0.8));
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: flex-end;
            padding: 20px;
        }

        .quantum-product:hover .product-overlay {
            opacity: 1;
        }

        .quick-view-btn {
            background: var(--primary);
            color: var(--dark);
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quick-view-btn:hover {
            background: var(--secondary);
            transform: scale(1.05);
        }

        .product-info {
            padding: 25px;
        }

        .product-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .product-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 15px;
        }

        .product-desc {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .add-to-cart {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: var(--dark);
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .add-to-cart::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.5s ease;
        }

        .add-to-cart:hover::before {
            width: 300px;
            height: 300px;
        }

        .add-to-cart:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.5);
        }

        /* Cart & Checkout Links */
        .shop-actions {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 999;
        }

        .floating-action {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border: none;
            color: var(--dark);
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.3);
        }

        .floating-action:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(0, 255, 255, 0.5);
        }

        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--secondary);
            color: var(--light);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .quantum-title {
                font-size: 2.5rem;
            }

            .quantum-categories {
                gap: 15px;
            }

            .category-card {
                min-width: 150px;
                padding: 20px;
            }

            .quantum-products {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 20px;
            }
        }
    </style>
</head>
<body>

        window.NLBL_MEDIA_BASE_URL = "https://no-limits-beyond-limitations.vercel-storage.com";
    </script>

    <nav class="quantum-nav">

            <div class="nav-actions">
                <button class="quantum-btn" onclick="window.location.href='index.html'">

                <div class="category-count" id="womens-count">Loading...</div>

    <script>
        // Quantum Cursor Effect
        const cursor = document.querySelector('.quantum-cursor');
        let mouseX = 0, mouseY = 0;
        let cursorX = 0, cursorY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animateCursor() {
            cursorX += (mouseX - cursorX) * 0.1;
            cursorY += (mouseY - cursorY) * 0.1;

            cursor.style.left = cursorX - 10 + 'px';
            cursor.style.top = cursorY - 10 + 'px';

            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // Generate Floating Particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 50;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (15 + Math.random() * 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }
        createParticles();

        // Shop Data
        const cartKey = "nlbl_shop_cart";
        let products = [];
        let cart = JSON.parse(localStorage.getItem(cartKey) || "[]");

        // Category Mapping - Updated to match actual product categories
        const categoryMap = {
            mens: [
                'hoodies',
                't-shirts',
                'jackets',
                'joggers',
                'pants',
                'shorts',
                'tank-tops',
                'sweats',
                'pants',
                'underwear',
                'boxers',
                'caps',
                'hats',
                'beanies',
                'backpacks',
                'bags',
                'limited-edition',
                'accessories',
                'men',
                'mens'
            ],
            womens: [
                't-shirts',
                'hoodies',
                'tank-tops',
                'leggings',
                'dresses',
                'bras',
                'lingerie',
                'skirts',
                'jackets',
                'pants',
                'shorts',
                'accessories',
                'scarves',
                'womens',
                'women'
            ],
            kids: [
                'kids-t-shirts',
                'kids-hoodies',
                'kids-shorts',
                'kids-pants',
                'kids-dresses',
                'kids-jackets',
                'kids-accessories',
                'kids',
                'child'
            ],
            accessories: [
                'accessories',
                'bags',
                'backpacks',
                'hats',
                'beanies',
                'socks',
                'jewelry',
                'belts',
                'underwear',
                'boxers',
                'caps'
            ]
        };

        const typeLabelMap = {
            'limited-edition': 'Limited Edition',
            joggers: 'Joggers',
            'tank-tops': 'Tank Tops',
            't-shirts': 'T-Shirts',
            jackets: 'Jackets',
            accessories: 'Accessories',
            hoodies: 'Hoodies',
            all: 'All'
        };

        let activeTypeFilter = 'all';

        const mediaBaseUrl = window.NLBL_MEDIA_BASE_URL || "";

        const displayNameMap = {
            "3bd8766c-b275-4ef7-a7ac-58324440d7eb.png": "Cosmic Hoodie • Nebula Rose",
            "9a8ad6f6-cef8-4603-bbbd-89580e4a33f3.png": "Cosmic Hoodie • Midnight Pulse",
            "c2f67149-7b43-43d5-ba46-0e8269097de2.png": "Cosmic Hoodie • Radiant Trail",
            "03b5fa1c-4671-4abd-83c5-e745b543f4a4.png": "Legacy Tee • Prime Crew",
            "0791d64d-2ca4-4e98-8c94-6bb65a092a58.png": "Legacy Tee • Aurora Signal",
            "07c8b7fa-101f-4a7b-aa39-5ad82665536c.png": "Legacy Tee • Comet Echo",
            "edb74ea9-01af-437e-aa0e-e0173af4157d.png": "Stellar Tank • Galaxy Drift",
            "ee7d171e-bead-461a-b9eb-5b0afc1cb548.png": "Stellar Tank • Eclipse",
            "f0f57f83-1a79-4e78-8c57-2fb725dee128.png": "Stellar Tank • Aurora Vibes",
            "f15d52f3-b8dc-457d-8670-0659ea7133be.png": "Stellar Tank • Pulse Wave",
            "f3558af9-31c3-4ea5-8da8-87557e2a9a04.png": "Stellar Tank • Midnight Crest",
            "f8fa3024-e054-4bc9-9b9f-572701bd2c93.png": "Stellar Tank • Nebula Shine",
        };

        const folderCategoryOverrides = {
            "clothing_product_4": { category: "hoodies", name: "Cosmic Hoodie" },
            "clothing_product_5": { category: "t-shirts", name: "Legacy Tee" },
            "clothing_product_6": { category: "jackets", name: "Quantum Jacket" },
            "clothing_product_3": { category: "joggers", name: "Gravity Jogger" },
            "clothing_product_2": { category: "tank-tops", name: "Stellar Tank" },
            "mix1": { category: "shoes", name: "Nebula Runner" },
            "mix2": { category: "shoes", name: "Nebula Runner" },
            "clothing_poduct": { category: "accessories", name: "Galactic Accessory" },
            "clothing_product": { category: "accessories", name: "Galactic Accessory" },
        };

        // Load Products
        async function loadProducts() {
            try {
                const res = await fetch("/data/products.json", { cache: "no-store" });
                if (!res.ok) throw new Error(`products HTTP ${res.status}`);
                const payload = await res.json();
                const items = Array.isArray(payload.items) ? payload.items : [];

                const normalized = items
                    .filter((p) => p && typeof p.id !== "undefined")
                    .map((p) => {
                        const localImage = p.image ? p.image.replace(/^\//, "") : "";
                        const remoteImage = p.image
                            ? `${mediaBaseUrl ? `${mediaBaseUrl.replace(/\/$/, "")}/` : ""}${p.image}`
                            : "";
                        const imageUrl = mediaBaseUrl ? remoteImage : localImage;
                        const folderKey = (p.folder || "").toLowerCase();
                        const override =
                            folderCategoryOverrides[folderKey] ||
                            folderCategoryOverrides[folderKey.replace(/\\/g, "/")] ||
                            Object.entries(folderCategoryOverrides).find(([key]) =>
                                folderKey.includes(key),
                            )?.[1];

                        const filename = (p.filename || "").split("/").pop() || "";
                        const resolvedName =
                            displayNameMap[filename] ||
                            override?.name ||
                            p.name ||
                            "Untitled";
                        const resolvedCategory = override?.category || p.category || "custom";

                        return {
                            ...p,
                            imageUrl,
                            localImage,
                            remoteImage,
                            resolvedCategory,
                            resolvedName,
                        };
                    })
                    .map((p) => ({
                        id: p.id,
                        name: p.resolvedName,
                        price: typeof p.price === "number" ? p.price : 0,
                        category: p.resolvedCategory,
                        desc: p.desc || "",
                        imageUrl: p.imageUrl || "",
                        imageRemote: p.remoteImage || "",
                        imageLocal: p.localImage || "",
                        printfulVariantId: typeof p.printfulVariantId === "number" ? p.printfulVariantId : null,
                        printfulProductId: typeof p.printfulProductId === "number" ? p.printfulProductId : null,
                        variants: Array.isArray(p.variants) ? p.variants : [],
                        emoji: p.emoji || "🛍️",
                    }));

                if (normalized.length) {
                    products = normalized;
                    console.log(`Loaded ${normalized.length} products from products.json`);
                    console.log('Sample product:', normalized[0]);
                    console.log('Categories found:', [...new Set(normalized.map(p => p.category))]);
                    updateCategoryCounts();
                    renderProducts('all');
                    renderTypeFilters();
                }
            } catch (e) {
                console.warn("Failed to load products.json:", e);
            }
        }

        // Update Category Counts
        function updateCategoryCounts() {
            console.log('All products categories:', products.map(p => p.category));

            const counts = {
                all: products.length,
                mens: products.filter(p => categoryMap.mens.includes(p.category) || p.category.includes('men') || p.category.includes('male')).length,
                womens: products.filter(p => categoryMap.womens.includes(p.category) || p.category.includes('women') || p.category.includes('female')).length,
                kids: products.filter(p => categoryMap.kids.includes(p.category) || p.category.includes('kid') || p.category.includes('child')).length,
                accessories: products.filter(p => categoryMap.accessories.includes(p.category) || p.category.includes('accessories') || p.category.includes('hat') || p.category.includes('sock') || p.category.includes('bag')).length
            };

            console.log('Category counts:', counts);

            Object.keys(counts).forEach(category => {
                const element = document.getElementById(`${category}-count`);
                if (element) {
                    element.textContent = `${counts[category]} items`;
                }
            });
        }

        function renderTypeFilters() {
            const container = document.getElementById('type-filters');
            if (!container) return;
            const categories = ['all', ...new Set(products.map((p) => p.category))];
            container.innerHTML = categories
                .map(
                    (cat) => `
                <button data-filter="${cat}" class="${activeTypeFilter === cat ? 'active' : ''}">
                    ${typeLabelMap[cat] || cat.replace(/-/g, ' ').replace(/\b\w/g, (l) => l.toUpperCase())}
                </button>
            `,
                )
                .join('');

            container.querySelectorAll('button').forEach((btn) => {
                btn.addEventListener('click', () => {
                    setTypeFilter(btn.dataset.filter);
                });
            });
        }

        function setTypeFilter(filter) {
            activeTypeFilter = filter || 'all';
            const container = document.getElementById('type-filters');
            container?.querySelectorAll('button').forEach((btn) => {
                const isActive = btn.dataset.filter === activeTypeFilter;
                btn.classList.toggle('active', isActive);
            });
            renderProducts('all');
        }

        // Filter by Category
        function filterByCategory(category) {
            // Update active state
            document.querySelectorAll('.category-card').forEach((card) => {
                card.style.borderColor = 'rgba(139, 92, 246, 0.3)';
            });
            const target = event?.currentTarget || null;
            if (target) {
                target.style.borderColor = 'var(--primary)';
            }
            setTypeFilter('all');

            renderProducts(category);
        }

        // Render Products
        function renderProducts(category = 'all') {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';

            let filtered = products;
            if (activeTypeFilter !== 'all') {
                filtered = products.filter((p) => p.category === activeTypeFilter);
            } else if (category !== 'all') {
                if (category === 'mens') {
                    filtered = products.filter((p) => categoryMap.mens.includes(p.category) || p.category.includes('men') || p.category.includes('male'));
                } else if (category === 'womens') {
                    filtered = products.filter((p) => categoryMap.womens.includes(p.category) || p.category.includes('women') || p.category.includes('female'));
                } else if (category === 'kids') {
                    filtered = products.filter((p) => categoryMap.kids.includes(p.category) || p.category.includes('kid') || p.category.includes('child'));
                } else if (category === 'accessories') {
                    filtered = products.filter((p) => categoryMap.accessories.includes(p.category) || p.category.includes('accessories') || p.category.includes('hat') || p.category.includes('sock') || p.category.includes('bag'));
                }
            }

            console.log(`Rendering ${filtered.length} products for category: ${category}`);

            if (filtered.length === 0) {
                grid.innerHTML = '<div style="text-align: center; color: rgba(255,255,255,0.6); font-size: 1.2rem; grid-column: 1/-1;">No products found in this category.</div>';
                return;
            }

                filtered.forEach((product, index) => {
                    const card = document.createElement('div');
                    card.className = 'quantum-product';
                    card.style.animationDelay = `${index * 0.1}s`;

                const imageMarkup = product.imageUrl
                    ? `<img src="${product.imageUrl}" alt="${product.name}" loading="lazy" class="product-image" data-local="${product.imageLocal}" data-remote="${product.imageRemote}" onerror="handleProductImageError(this)">`
                    : `<div style="display: flex; align-items: center; justify-content: center; height: 100%; font-size: 4rem;">${product.emoji}</div>`;

                card.innerHTML = `
                    <div class="product-image-container">
                        ${imageMarkup}
                        <div class="product-overlay">
                            <button class="quick-view-btn" onclick="quickView(${product.id})">Quick View</button>
                        </div>
                    </div>
                    <div class="product-info">
                        <h3 class="product-name">${product.name}</h3>
                        <div class="product-price">$${product.price.toFixed(2)}</div>
                        <p class="product-desc">${product.desc}</p>
                        <button class="add-to-cart" onclick="addToCart(${product.id})">
                            Add to Cart
                        </button>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // Add to Cart
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            const existing = cart.find(item => item.productId === productId);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({
                    productId: product.id,
                    name: product.name,
                    price: product.price,
                    quantity: 1,
                    imageUrl: product.imageUrl,
                    printfulVariantId: product.printfulVariantId
                });
            }

            localStorage.setItem(cartKey, JSON.stringify(cart));
            updateCartCount();

            // Visual feedback
            showNotification('Product added to cart!');
        }

        // Quick View
        function quickView(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            showNotification(`Quick view: ${product.name} - $${product.price.toFixed(2)}`);
        }

        // Update Cart Count
        function updateCartCount() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cart-count').textContent = count;
        }

        // Show Notification
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 100px;
                right: 20px;
                background: linear-gradient(45deg, var(--primary), var(--secondary));
                color: var(--dark);
                padding: 15px 25px;
                border-radius: 25px;
                font-family: 'Orbitron', sans-serif;
                font-weight: 700;
                z-index: 10000;
                animation: slideIn 0.3s ease;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => notification.remove(), 300);
            }, 2000);
        }

        // Add animations
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            @keyframes slideOut {
                from { transform: translateX(0); opacity: 1; }
                to { transform: translateX(100%); opacity: 0; }
            }
            .quantum-product {
                animation: fadeInUp 0.6s ease forwards;
                opacity: 0;
            }
            @keyframes fadeInUp {
                from { transform: translateY(30px); opacity: 0; }
                to { transform: translateY(0); opacity: 1; }
            }
        `;
        document.head.appendChild(style);

        function handleProductImageError(img) {
            const nextSrc = img.dataset.local && img.src !== img.dataset.local ? img.dataset.local : img.dataset.remote;
            if (nextSrc && img.src !== nextSrc) {
                img.src = nextSrc;
                return;
            }
            img.style.display = 'none';
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadProducts();
            updateCartCount();
        });
    </script>
</body>
</html>
