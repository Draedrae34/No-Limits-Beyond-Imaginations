<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sacred Geometry Chakra Visualizer Engine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
    #webgl-canvas { width: 100vw; height: 100vh; display: block; }

    #ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      color: #fff;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      min-width: 220px;
    }

    #chakra-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    #chakra-sub {
      font-size: 0.85rem;
      opacity: 0.8;
      margin-top: 4px;
      margin-bottom: 10px;
    }

    select, button {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 8px;
      width: 100%;
      font-size: 0.9rem;
    }

    button:active {
      transform: translateY(1px);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui-overlay">
    <div id="chakra-title">Root Chakra (396 Hz)</div>
    <div id="chakra-sub">Grounding & Sacred Earth Torus Grid</div>
    <select id="chakra-select">
      <option value="0">Root - 396 Hz</option>
      <option value="1">Sacral - 417 Hz</option>
      <option value="2">Solar Plexus - 528 Hz</option>
      <option value="3">Heart - 639 Hz</option>
      <option value="4">Throat - 741 Hz</option>
      <option value="5">Third Eye - 852 Hz</option>
      <option value="6">Crown - 963 Hz</option>
    </select>
    <button id="audio-toggle">Activate Sonic Engine</button>
  </div>

  <canvas id="webgl-canvas"></canvas>

  <script>
    const fragmentShader = `
      uniform float u_time;
      uniform float u_audioLow;
      uniform float u_audioHigh;
      uniform vec3 u_primaryColor;
      uniform vec3 u_secondaryColor;
      uniform vec2 u_resolution;
      uniform float u_chakraMode;

      varying vec2 vUv;

      void main() {
        vec2 st = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;
        float dist = length(st);
        float angle = atan(st.y, st.x);

        float energy = u_audioLow * 1.5 + 0.2;
        float pattern = 0.0;

        if (u_chakraMode < 0.5) {
          vec2 grid = abs(fract(st * 8.0 - u_time * 0.1) - 0.5);
          pattern = smoothstep(0.45, 0.5, max(grid.x, grid.y) + energy * 0.1);
        } else if (u_chakraMode < 1.5) {
          pattern = sin(st.x * 12.0 + u_time) * cos(st.y * 12.0 + u_time * 0.8) + energy;
        } else if (u_chakraMode < 2.5) {
          pattern = sin(angle * 10.0 + u_time * 2.0) * 0.5 + 0.5;
          pattern *= smoothstep(0.5, 0.1, dist);
        } else if (u_chakraMode < 3.5) {
          float lotus = sin(angle * 12.0 + sin(u_time)) * 0.2 + 0.3;
          pattern = smoothstep(lotus, lotus + 0.02, dist) - smoothstep(lotus + 0.05, lotus + 0.07, dist);
        } else if (u_chakraMode < 4.5) {
          pattern = sin(st.x * 20.0 * energy) * sin(st.y * 20.0 * energy);
        } else if (u_chakraMode < 5.5) {
          float spiral = angle * 6.0 + dist * 15.0 - u_time * 2.0;
          pattern = sin(spiral) * smoothstep(0.8, 0.0, dist);
        } else if (u_chakraMode < 6.5) {
          float portal = sin(1.0 / (dist + 0.05) - u_time * 3.0);
          pattern = smoothstep(0.2, 0.8, portal) * energy;
        }

        vec3 finalColor = mix(u_secondaryColor, u_primaryColor, pattern + energy * 0.3);
        finalColor += (0.05 / dist) * u_primaryColor * energy;

        gl_FragColor = vec4(finalColor, 1.0);
      }
    `;

    const vertexShader = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
      }
    `;

    const canvas = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const uniforms = {
      u_time: { value: 0 },
      u_audioLow: { value: 0 },
      u_audioHigh: { value: 0 },
      u_primaryColor: { value: new THREE.Color(0xff2a2a) },
      u_secondaryColor: { value: new THREE.Color(0x330000) },
      u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
      u_chakraMode: { value: 0 }
    };

    const material = new THREE.ShaderMaterial({
      vertexShader,
      fragmentShader,
      uniforms
    });

    const geometry = new THREE.PlaneGeometry(2, 2);
    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    const chakraConfig = [
      { freq: 396, primary: '#ff2a2a', secondary: '#330000', title: 'Root Chakra (396 Hz)', sub: 'Grounding & Sacred Earth Torus Grid' },
      { freq: 417, primary: '#ff8c00', secondary: '#331a00', title: 'Sacral Chakra (417 Hz)', sub: 'Creativity & Hydro-Fluid Dynamics' },
      { freq: 528, primary: '#ffd700', secondary: '#332b00', title: 'Solar Plexus (528 Hz)', sub: 'Personal Power & Sri Yantra Radiance' },
      { freq: 639, primary: '#00ff88', secondary: '#00331a', title: 'Heart Chakra (639 Hz)', sub: 'Compassion & 12-Petaled Lotus Fractal' },
      { freq: 741, primary: '#00f2fe', secondary: '#003333', title: 'Throat Chakra (741 Hz)', sub: 'Expression & Harmonograph Standing Waves' },
      { freq: 852, primary: '#7b2ff7', secondary: '#1a0033', title: 'Third Eye (852 Hz)', sub: 'Insight & Merkaba Sacred Vortex' },
      { freq: 963, primary: '#ffffff', secondary: '#1a1a33', title: 'Crown Chakra (963 Hz)', sub: 'Unity & Infinite Torus Energy Portal' }
    ];

    let audioCtx, analyser, dataArray, currentOsc;
    const audioToggle = document.getElementById('audio-toggle');
    const chakraSelect = document.getElementById('chakra-select');
    const chakraTitle = document.getElementById('chakra-title');
    const chakraSub = document.getElementById('chakra-sub');

    function updateChakraUI(index) {
      const cfg = chakraConfig[index];
      uniforms.u_chakraMode.value = index;
      uniforms.u_primaryColor.value.set(cfg.primary);
      uniforms.u_secondaryColor.value.set(cfg.secondary);
      chakraTitle.textContent = cfg.title;
      chakraSub.textContent = cfg.sub;

      if (currentOsc) {
        currentOsc.frequency.setTargetAtTime(cfg.freq, audioCtx.currentTime, 0.05);
      }
    }

    chakraSelect.addEventListener('change', (e) => {
      updateChakraUI(parseInt(e.target.value, 10));
    });

    audioToggle.addEventListener('click', () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        dataArray = new Uint8Array(analyser.frequencyBinCount);

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        gain.gain.value = 0.15;
        osc.type = 'sine';
        osc.frequency.value = chakraConfig[0].freq;
        osc.connect(gain);
        gain.connect(analyser);
        analyser.connect(audioCtx.destination);
        osc.start();
        currentOsc = osc;

        audioToggle.textContent = 'Sonic Engine Active';
        audioToggle.style.opacity = '0.6';
        audioToggle.disabled = true;

        updateChakraUI(0);
      }
    });

    function animate(time) {
      requestAnimationFrame(animate);
      uniforms.u_time.value = time * 0.001;

      if (analyser) {
        analyser.getByteFrequencyData(dataArray);
        uniforms.u_audioLow.value = dataArray[2] / 255.0;
        uniforms.u_audioHigh.value = dataArray[20] / 255.0;
      }

      renderer.render(scene, camera);
    }

    animate(0);

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
