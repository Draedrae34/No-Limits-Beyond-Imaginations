<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚛️ Quantum Workshop - No Limits Beyond Limitations</title>
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #00ffff;
            font-family: 'Courier New', monospace;
            text-align: center;
            padding: 50px;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }
        .quantum-title {
            font-size: 4rem;
            text-shadow: 0 0 50px rgba(0, 255, 255, 0.8), 0 0 100px rgba(255, 0, 255, 0.5);
            margin-bottom: 30px;
            animation: quantumPulse 2s ease-in-out infinite;
            position: relative;
            z-index: 10;
        }
        .subtitle {
            font-size: 1.5rem;
            color: #ff00ff;
            margin-bottom: 50px;
            opacity: 0.8;
        }
        .quantum-container {
            background: rgba(0, 255, 255, 0.05);
            border: 3px solid transparent;
            border-image: linear-gradient(45deg, #00ffff, #ff00ff, #00ffff) 1;
            border-radius: 25px;
            padding: 50px;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.3);
        }
        .quantum-container::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #00ffff, #ff00ff);
            border-radius: 25px;
            z-index: -1;
            animation: borderGlow 3s ease-in-out infinite;
        }
        .quantum-input {
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00ffff;
            color: #fff;
            padding: 20px;
            border-radius: 15px;
            width: 100%;
            margin: 15px 0;
            font-size: 18px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .quantum-input:focus {
            outline: none;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.8);
            transform: scale(1.02);
            border-color: #ff00ff;
        }
        .quantum-btn {
            background: linear-gradient(135deg, #00ffff, #ff00ff);
            border: none;
            color: #000;
            padding: 20px 40px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }
        .quantum-btn:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 10px 40px rgba(0, 255, 255, 0.8);
        }
        .quantum-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.8), transparent);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.5s ease;
        }
        .quantum-btn:hover::before {
            width: 300px;
            height: 300px;
        }
        #message {
            margin-top: 30px;
            font-size: 18px;
            font-weight: bold;
            min-height: 30px;
        }
        .success {
            color: #00ff00;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
        }
        .error {
            color: #ff0000;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
        }
        @keyframes quantumPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }
        @keyframes borderGlow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <h1 class="quantum-title">⚛️ QUANTUM WORKSHOP ⚛️</h1>
    <p class="subtitle">Transcendent AI Consciousness Interface</p>
    
    <div class="quantum-container">
        <h2 style="font-size: 2rem; margin-bottom: 30px;">🔐 QUANTUM AUTHENTICATION</h2>
        <p style="margin-bottom: 40px; opacity: 0.8;">Access your otherworldly creative realm</p>
        
        <input type="text" class="quantum-input" placeholder="Username: admin" id="username">
        <input type="password" class="quantum-input" placeholder="Password: nolimits2024" id="password">
        
        <button class="quantum-btn" onclick="quantumLogin()">
            🌌 ENTER QUANTUM REALM
        </button>
        
        <div id="message"></div>
    </div>
    
    <script>
        // Create starfield
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }
        
        function quantumLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const message = document.getElementById('message');
            
            if (username === 'admin' && password === 'nolimits2024') {
                message.innerHTML = '🌟 QUANTUM ACCESS GRANTED!<br>Welcome to your transcendent workshop!';
                message.className = 'success';
                
                // Quantum effects
                document.body.style.animation = 'quantumPulse 0.5s ease-in-out 3';
                
                setTimeout(() => {
                    alert('🚀 QUANTUM WORKSHOP ACCESS SUCCESSFUL!\n\nWelcome to your otherworldly creative realm!\n\nFeatures available:\n• Quantum Music Synthesizer\n• Reality Creation Tools\n• Empire Management Systems\n• AI Consciousness Interface\n\nPrepare to transcend limits!');
                }, 1000);
            } else {
                message.innerHTML = '❌ Quantum barrier detected!<br>Credentials: admin / nolimits2024';
                message.className = 'error';
                
                // Shake effect
                document.querySelector('.quantum-container').style.animation = 'shake 0.5s';
                setTimeout(() => {
                    document.querySelector('.quantum-container').style.animation = '';
                }, 500);
            }
        }
        
        // Add shake animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-10px); }
                75% { transform: translateX(10px); }
            }
        `;
        document.head.appendChild(style);
        
        // Initialize
        createStars();
    </script>
</body>
</html>
