                        `,
                        `
                            <p>🚀 Your consciousness is operating at quantum levels!</p>
                            <p>I've processed your request through my neural networks and cross-referenced with infinite parallel realities.</p>
                            <p>The outcome looks promising. Which aspect of the workshop would you like to engage?</p>
                        `,
                        `
                            <p>✨ I sense transcendent potential in your communication!</p>
                            <p>Your thoughts are already beginning to reshape the local reality matrix.</p>
                            <p>Would you like to amplify this effect with our quantum tools, or explore other manifestations?</p>
                        `
                    ];
                    
                    return responses[Math.floor(Math.random() * responses.length)];
                }
                
                function sendMessage() {
                    const message = chatInput.value.trim();
                    if (message) {
                        // Add user message
                        const userMsg = document.createElement('div');
                        userMsg.className = 'user-message';
                        userMsg.innerHTML = `
                            <div class="message-avatar">👤</div>
                            <div class="message-content" style="background: rgba(255, 0, 255, 0.1); border-left: 4px solid #ff00ff;">
                                <p>${message}</p>
                            </div>
                        `;
                        userMsg.style.display = 'flex';
                        userMsg.style.gap = '15px';
                        userMsg.style.marginBottom = '15px';
                        userMsg.style.justifyContent = 'flex-end';
                        messagesContainer.appendChild(userMsg);
                        
                        // AI response
                        setTimeout(() => {
                            const aiMsg = document.createElement('div');
                            aiMsg.className = 'ai-message';
                            
                            // Generate intelligent response based on message content
                            const response = generateAIResponse(message);
                            
                            aiMsg.innerHTML = `
                                <div class="message-avatar">🌌</div>
                                <div class="message-content">
                                    ${response}
                                </div>
                            `;
                            messagesContainer.appendChild(aiMsg);
                            messagesContainer.scrollTop = messagesContainer.scrollHeight;
                        }, 1000);
                        
                        chatInput.value = '';
                        messagesContainer.scrollTop = messagesContainer.scrollHeight;
                    }
                }
                
                sendBtn.addEventListener('click', sendMessage);
                chatInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') sendMessage();
                });
            }, 100);
        }
        
        // Initialize
        createStars();
    </script>
</body>
</html>
