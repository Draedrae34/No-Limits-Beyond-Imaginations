<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Private Space | Silent Spirits Legacy</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Raleway:wght@300&display=swap" rel="stylesheet">
    <style>
        body {
            background: #03010a;
            color: #e2e8f0;
            font-family: 'Raleway', sans-serif;
            padding: 50px;
        }
        .dashboard {
            max-width: 900px;
            margin: 0 auto;
        }
        header { border-bottom: 2px solid #8b5cf6; padding-bottom: 20px; margin-bottom: 40px; }
        h1 { font-family: 'Orbitron', sans-serif; color: #ffd700; margin: 0; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .tool-card {
            background: rgba(255,255,255,0.05);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid rgba(139, 92, 246, 0.2);
            transition: 0.3s;
        }
        .tool-card:hover { background: rgba(139, 92, 246, 0.1); border-color: #8b5cf6; }
        .status-dot { height: 10px; width: 10px; background: #00ffff; border-radius: 50%; display: inline-block; margin-right: 10px; }
        .btn-action { color: #00ffff; text-decoration: none; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="dashboard">
        <header>
            <h1>THE SPACE</h1>
            <p>Legacy Control Center — All Engines Operational</p>
        </header>

        <div class="grid">
            <div class="tool-card">
                <h3><span class="status-dot"></span>Message Wall</h3>
                <p>Moderate and manage tributes for R.J. and T-Mainney.</p>
                <a href="message-wall.html" class="btn-action">View Wall</a>
            </div>
            <div class="tool-card">
                <h3><span class="status-dot"></span>Inventory</h3>
                <p>Syncing with Printify Shop ID. 50+ Products active.</p>
                <a href="shop.html" class="btn-action">Check Shop</a>
            </div>
            <div class="tool-card">
                <h3><span class="status-dot"></span>System Sync</h3>
                <button onclick="logout()" style="background:none; border:1px solid #ff0d99; color:#ff0d99; padding:5px 10px; cursor:pointer;">Logout</button>
            </div>
        </div>
    </div>

    <script>
        // Auth Guard
        (async function checkAuth() {
            const res = await fetch('/api/auth');
            const data = await res.json();
            if (!data.authenticated) {
                window.location.href = "workshop-login.html";
            }
        })();

        async function logout() {
            await fetch('/api/auth', { method: 'DELETE' });
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
