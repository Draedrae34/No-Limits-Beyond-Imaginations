<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Silent Spirits Workshop</title>

  <style>
    body {
      margin: 0;
      background: #0a0a0a;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
      background: #111;
      border-bottom: 1px solid #333;
      text-align: center;
      font-size: 1.6rem;
      font-weight: bold;
      letter-spacing: 1px;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 15px;
      background: #141414;
      border-bottom: 1px solid #222;
    }

    nav button {
      background: #222;
      color: white;
      border: 1px solid #444;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }

    nav button.active {
      background: #6a00ff;
      border-color: #8f3dff;
      box-shadow: 0 0 10px #6a00ff;
    }

    nav button:hover {
      background: #333;
    }

    .panel {
      display: none;
      padding: 20px;
    }

    .panel.active {
      display: block;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #333;
      text-align: left;
    }

    th {
      background: #1a1a1a;
    }

    .message-box {
      background: #111;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid #333;
    }

    .upload-box {
      background: #111;
      padding: 20px;
      border-radius: 6px;
      border: 1px solid #333;
      margin-top: 20px;
    }

    .upload-box input,
    .upload-box button {
      display: block;
      width: 100%;
      margin-top: 10px;
    }

    .upload-box button {
      max-width: 180px;
      margin: 10px 0 0;
      width: auto;
    }

    .panel-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .panel-status {
      color: #bbb;
      font-size: 0.95rem;
      line-height: 1.4;
      min-height: 1.4rem;
    }

    @media (max-width: 720px) {
      nav {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>
  <header>Silent Spirits Workshop Dashboard</header>

  <nav>
    <button class="tab-btn active" data-tab="orders">Orders</button>
    <button class="tab-btn" data-tab="messages">Messages</button>
    <button class="tab-btn" data-tab="gallery">Gallery</button>
  </nav>

  <!-- ORDERS PANEL -->
  <div id="orders" class="panel active">
    <h2>Orders</h2>
    <p>All PayPal orders logged in Neon.</p>
    <div class="panel-actions">
      <button id="refresh-orders">Refresh Orders</button>
      <div id="orders-status" class="panel-status">Loaded orders will appear below.</div>
    </div>
    <table id="orders-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Product</th>
          <th>Amount</th>
          <th>Buyer</th>
          <th>Email</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- MESSAGES PANEL -->
  <div id="messages" class="panel">
    <h2>Message Wall Submissions</h2>
    <div class="panel-actions">
      <button id="refresh-messages">Refresh Messages</button>
      <div id="messages-status" class="panel-status">Loaded messages will appear below.</div>
    </div>
    <div id="messages-container"></div>
  </div>

  <!-- GALLERY PANEL -->
  <div id="gallery" class="panel">
    <h2>Remembrance Gallery</h2>
    <p>Upload new Stand Still photos here.</p>

    <div class="panel-actions">
      <button id="refresh-gallery">Refresh Gallery</button>
      <div id="gallery-status" class="panel-status">Choose a photo to upload.</div>
    </div>

    <div class="upload-box">
      <input type="file" id="gallery-upload" />
      <button id="upload-btn">Upload</button>
    </div>

    <div id="gallery-items" style="margin-top: 20px;"></div>
  </div>

  <script src="workshop.js"></script>
</body>
</html>
