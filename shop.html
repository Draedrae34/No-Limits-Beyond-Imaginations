<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0c0c0c">
    <title>Products | No Limits Beyond Limitations</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #00FFFF;
            --secondary: #FF69B4;
            --gold: #FFD700;
            --dark: #0c0c0c;
            --light: #ffffff;
        }
        
        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--dark);
            color: var(--light);
            min-height: 100vh;
        }
        
        .cosmic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0c0c0c 100%);
            z-index: -1;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 100px 20px 100px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 50px;
        }
        
        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            background: linear-gradient(45deg, var(--primary), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header p {
            color: #888;
            margin-top: 10px;
        }
        
        /* Filters */
        .filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            transition: all 0.3s ease;
        }
        
        .filter-btn:hover, .filter-btn.active {
            background: var(--primary);
            color: var(--dark);
        }
        
        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }
        
        .product-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(0, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        
        .product-card:hover {
            transform: translateY(-10px);
            border-color: var(--gold);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
        }
        
        .product-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background: linear-gradient(45deg, #1a1a2e, #2a2a4e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }
        
        .product-info {
            padding: 25px;
        }
        
        .product-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 10px;
        }
        
        .product-price {
            font-size: 1.5rem;
            color: var(--gold);
            font-weight: 700;
            margin-bottom: 15px;
        }
        
        .product-desc {
            color: #888;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }
        
        .add-to-cart {
            width: 100%;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border: none;
            color: white;
            padding: 15px;
            border-radius: 50px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .add-to-cart:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        }
        
        /* Cart */
        .cart-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--gold);
            color: var(--gold);
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            z-index: 100;
        }
        
        .cart-count {
            background: var(--gold);
            color: var(--dark);
            padding: 2px 8px;
            border-radius: 20px;
            margin-left: 10px;
            font-size: 0.9rem;
        }
        
        /* Navigation */
        .nav-back {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            z-index: 100;
        }
        
        .nav-back:hover {
            background: var(--primary);
            color: var(--dark);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            .product-image { height: 180px; }
        }
    </style>
</head>
<body>
    <div class="cosmic-bg"></div>
    
    <a href="index.html" class="nav-back">← Back</a>
    <button class="cart-btn" onclick="alert('Cart feature coming soon!')">
        🛒 Cart <span class="cart-count" id="cart-count">0</span>
    </button>
    
    <div class="container">
        <header class="header">
            <h1>👕 Our Products 👕</h1>
            <p>Each piece is infused with our brothers' spirit</p>
        </header>
        
        <div class="filters">
            <button class="filter-btn active" data-category="all">All</button>
            <button class="filter-btn" data-category="t-shirts">T-Shirts</button>
            <button class="filter-btn" data-category="hoodies">Hoodies</button>
            <button class="filter-btn" data-category="accessories">Accessories</button>
            <button class="filter-btn" data-category="digital">Digital</button>
        </div>
        
        <div class="products-grid" id="products-grid">
            <!-- Products will be loaded here -->
        </div>
    </div>
    
    <script>
        // Sample products
        const products = [
            { id: 1, name: "No Limits T-Shirt", price: 29.99, category: "t-shirts", emoji: "👕", desc: "Premium cotton with our signature design" },
            { id: 2, name: "Cosmic Hoodie", price: 59.99, category: "hoodies", emoji: "🧥", desc: "Warm, comfortable, absolutely stunning" },
            { id: 3, name: "Quantum Cap", price: 24.99, category: "accessories", emoji: "🧢", desc: "Adjustable, stylish, cosmic design" },
            { id: 4, name: "Galaxy Tote Bag", price: 19.99, category: "accessories", emoji: "👜", desc: "Eco-friendly and gorgeous" },
            { id: 5, name: "Digital Art Print", price: 9.99, category: "digital", emoji: "🖼️", desc: "High-quality digital artwork" },
            { id: 6, name: "Brothers Tribute Tee", price: 34.99, category: "t-shirts", emoji: "👕", desc: "Honoring our fallen brothers" },
            { id: 7, name: "Stellar Sweatshirt", price: 54.99, category: "hoodies", emoji: "🧥", desc: "Perfect for cold cosmic nights" },
            { id: 8, name: "AI Assistant Tee", price: 29.99, category: "t-shirts", emoji: "🤖", desc: "For the tech-savvy soul" },
        ];
        
        let cartCount = 0;
        
        function renderProducts(category = 'all') {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';
            
            const filtered = category === 'all' 
                ? products 
                : products.filter(p => p.category === category);
            
            filtered.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-image">${product.emoji}</div>
                    <div class="product-info">
                        <h3 class="product-name">${product.name}</h3>
                        <div class="product-price">$${product.price}</div>
                        <p class="product-desc">${product.desc}</p>
                        <button class="add-to-cart" onclick="addToCart(${product.id})">
                            Add to Cart
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
        
        function addToCart(id) {
            cartCount++;
            document.getElementById('cart-count').textContent = cartCount;
            
            // Visual feedback
            const btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = '✓ Added!';
            btn.style.background = 'linear-gradient(45deg, #FFD700, #00FF00)';
            
            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.background = '';
            }, 1500);
        }
        
        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.onclick = function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                renderProducts(this.dataset.category);
            };
        });
        
        // Initial render
        renderProducts();
    </script>
</body>
</html>
